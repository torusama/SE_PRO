        transparent: true,
        alphaTest: 0.22,
        side: THREE.DoubleSide,
        envMapIntensity: 0.3,
      });

      // tao 1 the la (plane) da xoay/dat vi tri, tra ve BufferGeometry rieng de
      // gop lai sau (mergeBufferGeometries) - giu so draw call thap du co nhieu the
      function makeLeafCardGeo(w, h, x, y, z, rotY, rotX, rotZ) {
        const g = new THREE.PlaneGeometry(w, h);
        g.translate(0, h * 0.5, 0);
        const m = new THREE.Matrix4().makeRotationFromEuler(
          new THREE.Euler(rotX || 0, rotY || 0, rotZ || 0),
        );
        m.setPosition(x, y, z);
        g.applyMatrix4(m);
        return g;
      }
      // dung mot cum "sprig" (nhanh la chi tiet) quanh 1 tam, nhieu the cheo nhau
      function buildSprigCluster(cx, cy, cz, radius, count) {
        const geos = [];
        for (let i = 0; i < count; i++) {
          const a = (i / count) * Math.PI * 2 + Math.random() * 0.6;
          const r = radius * (0.35 + Math.random() * 0.65);
          const x = cx + Math.cos(a) * r,
            z = cz + Math.sin(a) * r;
          const y = cy + (Math.random() - 0.3) * radius * 0.7;
          const w = radius * (0.9 + Math.random() * 0.5),
            h = w * 1.3;
          geos.push(
            makeLeafCardGeo(
              w,
              h,
              x,
              y,
              z,
              a + Math.PI / 2,
              (Math.random() - 0.5) * 0.5,
              (Math.random() - 0.5) * 0.3,
            ),
          );
          geos.push(
            makeLeafCardGeo(
              w,
              h,
              x,
              y,
              z,
              a + Math.PI / 2 + Math.PI / 2,
              (Math.random() - 0.5) * 0.5,
              (Math.random() - 0.5) * 0.3,
            ),
          );
        }
        return THREE.BufferGeometryUtils.mergeBufferGeometries(geos);
      }
      // vai the "blob" lon, mo, dat sau/quanh cum sprig de lap day khoi tan,
      // tranh cam giac "thua la" khi nhin tu xa
      function buildBlobFiller(cx, cy, cz, radius, count) {
        const geos = [];
        for (let i = 0; i < count; i++) {
          const a = Math.random() * Math.PI * 2;
          const r = radius * 0.3;
          const x = cx + Math.cos(a) * r,
            z = cz + Math.sin(a) * r;
          const y = cy + (Math.random() - 0.4) * radius * 0.6;
          const s = radius * (1.3 + Math.random() * 0.6);
          geos.push(
            makeLeafCardGeo(
              s,
              s,
              x,
              y,
              z,
              Math.random() * Math.PI,
              (Math.random() - 0.5) * 0.4,
              0,
            ),
          );
        }
        return THREE.BufferGeometryUtils.mergeBufferGeometries(geos);
      }

      /* ------------------------------------------------------------------
       * Cay/hoa THAT tu model 3D (be gui - goi "Ultimate Stylized Nature":
       * BirchTree/MapleTree/Flower_Clump). TOI UU HIEU NANG: thay vi clone
       * rieng tung cay (hang nghin Object3D + hang nghin draw call), ta chi
       * GOM VI TRI truoc (dong bo, luc script chay), roi khi GLTFLoader tai
       * xong model, dung 1 InstancedMesh CHO MOI (giong cay x bien the x
       * than/tan la) de ve toan bo cay cung loai trong DUY NHAT 1 draw call
       * (~14 draw call cho toan bo rung, thay vi hang nghin). Lac nhe theo
       * gio van co, nhung chi ap dung cho InstancedMesh cua tan la (khong
       * dung Group rieng tung cay nua) bang cach cap nhat lai ma tran instance
       * moi frame - re hon rat nhieu so voi hang nghin draw call rieng.
       * ------------------------------------------------------------------ */
      const REAL_TREE_LIB = {
        birch: [],
        maple: [],
        flower: [],
        birchGreen: [],
        mapleGreen: [],
      };
      const pendingRealModelReqs = {
        birch: [],
        maple: [],
        flower: [],
        birchGreen: [],
        mapleGreen: [],
      };
      let realTreeAssetsLoaded = false;
      const leafSwayBatches = []; // {mesh, base:[{i,pos,rotY,scale,phase}]}
      (function loadRealTreeModels() {
        if (typeof THREE.GLTFLoader === "undefined") return;
        const loader = new THREE.GLTFLoader();
        const files = {
          birch: [
            "assets/models/trees/BirchTree_2.gltf",
            "assets/models/trees/BirchTree_3.gltf",
            "assets/models/trees/BirchTree_4.gltf",
          ],
          maple: [
            "assets/models/trees/MapleTree_1.gltf",
            "assets/models/trees/MapleTree_2.gltf",
            "assets/models/trees/MapleTree_4.gltf",
          ],
          flower: [
            "assets/models/trees/Flower_2_Clump.gltf",
            "assets/models/trees/Flower_4_Clump.gltf",
          ],
        };
        let toLoad = 0,
          loaded = 0;
        Object.values(files).forEach((arr) => (toLoad += arr.length));
        function onOneLoaded() {
          loaded++;
          if (loaded >= toLoad) buildRealTreeInstances();
        }
        Object.keys(files).forEach((kind) => {
          files[kind].forEach((path) => {
            loader.load(
              path,
              (gltf) => {
                // tach rieng mesh "than/vo cay" (Bark) va "tan la" (Leaves) de
                // xay 2 InstancedMesh rieng (tan la se duoc lac theo gio)
                let trunkGeo = null,
                  trunkMat = null,
                  leafGeo = null,
                  leafMat = null;
                gltf.scene.traverse((n) => {
                  if (!n.isMesh || !n.material) return;
                  n.material.envMapIntensity = 0.55;
                  const nm = n.material.name || "";
                  if (nm.includes("Leaves") || nm.includes("Flowers")) {
                    leafGeo = n.geometry;
                    leafMat = n.material;
                    leafMat.side = THREE.DoubleSide;
                    leafMat.alphaTest = 0.4;
                    leafMat.transparent = false;
                  } else {
                    trunkGeo = n.geometry;
                    trunkMat = n.material;
                  }
                });
                REAL_TREE_LIB[kind].push({
                  trunkGeo,
                  trunkMat,
                  leafGeo,
                  leafMat,
                });
                onOneLoaded();
              },
              undefined,
              () => {
                onOneLoaded();
              },
            );
          });
        });
      })();
      function buildRealTreeInstances() {
        realTreeAssetsLoaded = true;
        // "birchGreen": dung lai dung hinh cay Birch (than+tan la) nhung nhuom
        // mau la xanh la thay vi vang - dung rieng cho khu vuc quanh Khu Tam
        // Linh (ho phun nuoc, gan ghe da nghi chan) theo yeu cau
        REAL_TREE_LIB.birchGreen = REAL_TREE_LIB.birch.map((v) => ({
          trunkGeo: v.trunkGeo,
          trunkMat: v.trunkMat,
          leafGeo: v.leafGeo,
          leafMat: v.leafMat ? v.leafMat.clone() : null,
        }));
        REAL_TREE_LIB.birchGreen.forEach((v) => {
          if (v.leafMat) v.leafMat.color.setHex(0x4f9256);
        });
        // "mapleGreen": dung lai dung hinh cay Maple (than+tan la) nhung nhuom
        // nhe sang mau vang am (thay vi xanh la) - vi texture goc cua maple la
        // do/cam, nhan (multiply) voi mau xanh la se ra mau nau-do lem nhem rat
        // xau (kenh xanh la trong texture goc qua yeu). Nhuom vang thi hop mau
        // hon, giong tong voi cay birch, nhin tu nhien va sang hon nhieu.
        REAL_TREE_LIB.mapleGreen = REAL_TREE_LIB.maple.map((v) => ({
          trunkGeo: v.trunkGeo,
          trunkMat: v.trunkMat,
          leafGeo: v.leafGeo,
          leafMat: v.leafMat ? v.leafMat.clone() : null,
        }));
        REAL_TREE_LIB.mapleGreen.forEach((v) => {
          if (v.leafMat) v.leafMat.color.setHex(0xe0b24a);
        });
        const dummy = new THREE.Object3D();
        Object.keys(pendingRealModelReqs).forEach((libKind) => {
          const reqs = pendingRealModelReqs[libKind];
          const variants = REAL_TREE_LIB[libKind];
          if (!reqs.length || !variants || !variants.length) return;
          // chia deu request cho tung bien the (Birch_2/3/4, Maple_1/2/4, ...)
          const perVariant = variants.map(() => []);
          reqs.forEach((r, i) => perVariant[i % variants.length].push(r));
          variants.forEach((v, vi) => {
            const list = perVariant[vi];
            if (!list.length) return;
            if (v.trunkGeo) {
              const trunkMesh = new THREE.InstancedMesh(
                v.trunkGeo,
                v.trunkMat,
                list.length,
              );
              trunkMesh.castShadow = libKind !== "flower";
              trunkMesh.receiveShadow = true;
              trunkMesh.frustumCulled = false;
              list.forEach((r, i) => {
                dummy.position.set(r.px, 0, r.pz);
                dummy.rotation.set(0, r.rotY, 0);
                dummy.scale.setScalar(r.modelScale);
                dummy.updateMatrix();
                trunkMesh.setMatrixAt(i, dummy.matrix);
              });
              trunkMesh.instanceMatrix.needsUpdate = true;
              scene.add(trunkMesh);
            }
            if (v.leafGeo) {
              const leafMesh = new THREE.InstancedMesh(
                v.leafGeo,
                v.leafMat,
                list.length,
              );
              leafMesh.castShadow = libKind !== "flower";
              leafMesh.receiveShadow = true;
              leafMesh.frustumCulled = false;
              const base = [];
              list.forEach((r, i) => {
                dummy.position.set(r.px, 0, r.pz);
                dummy.rotation.set(0, r.rotY, 0);
                dummy.scale.setScalar(r.modelScale);
                dummy.updateMatrix();
                leafMesh.setMatrixAt(i, dummy.matrix);
                base.push({
                  i,
                  x: r.px,
                  z: r.pz,
                  rotY: r.rotY,
                  scale: r.modelScale,
                  phase: Math.random() * Math.PI * 2,
                  amp: 0.018 + Math.random() * 0.014,
                });
              });
              leafMesh.instanceMatrix.needsUpdate = true;
              scene.add(leafMesh);
              if (libKind !== "flower")
                leafSwayBatches.push({ mesh: leafMesh, base });
            }
          });
        });
        Object.keys(pendingRealModelReqs).forEach(
          (k) => (pendingRealModelReqs[k].length = 0),
        );
      }
      // Chi GOM vi tri (khong tao Object3D/scene.add nao ca) - hinh dang that
      // se duoc dung 1 lan bang InstancedMesh sau khi model tai xong (xem tren)
      function makeRealModelPlaceholder(
        px,
        pz,
        scale,
        libKind,
        modelScale,
        yOffset,
      ) {
        pendingRealModelReqs[libKind].push({
          px,
          pz,
          modelScale,
          rotY: Math.random() * Math.PI * 2,
        });
        addContactShadow(px, pz, scale * 0.36, 0.42);
      }

      function makeRealTree(px, pz, scale) {
        const group = new THREE.Group();
        const trunkH = 0.95 * scale;
        const trunk = new THREE.Mesh(
          new THREE.CylinderGeometry(0.028 * scale, 0.06 * scale, trunkH, 7),
          realBarkMat,
        );
        trunk.position.y = trunkH * 0.5;
        trunk.castShadow = true;
        group.add(trunk);
        // vai canh nho xien ra tu than, cung dung bark, de tan la khong "moc" thang tren dinh cot
        const branchCount = 3;
        for (let i = 0; i < branchCount; i++) {
          const by = trunkH * (0.55 + 0.16 * i);
          const ang = Math.random() * Math.PI * 2;
          const blen = scale * (0.28 + Math.random() * 0.16);
          const br = new THREE.Mesh(
            new THREE.CylinderGeometry(0.012 * scale, 0.02 * scale, blen, 5),
            realBarkMat,
          );
          br.position.set(
            Math.cos(ang) * blen * 0.4,
            by,
            Math.sin(ang) * blen * 0.4,
          );
          br.rotation.z = Math.PI / 2 - 0.5;
          br.rotation.y = ang;
          br.castShadow = true;
          group.add(br);
        }
        const canopyY = trunkH * 0.92;
        const canopyR = scale * 0.62;
        const sprigGeo = buildSprigCluster(0, canopyY, 0, canopyR, 7);
        const sprigMesh = new THREE.Mesh(sprigGeo, realSprigMat);
        sprigMesh.castShadow = true;
        group.add(sprigMesh);
        const blobGeo = buildBlobFiller(0, canopyY * 0.96, 0, canopyR, 3);
        const blobMesh = new THREE.Mesh(blobGeo, realBlobMat);
        blobMesh.castShadow = true;
        group.add(blobMesh);
        group.position.set(px, 0, pz);
        scene.add(group);
        addContactShadow(px, pz, scale * 0.36, 0.42);
        swayItems.push({
          group,
          f1: sprigMesh,
          f2: blobMesh,
          phase: Math.random() * Math.PI * 2,
          amp: 0.035 + Math.random() * 0.02,
        });
        return group;
      }

      const foliagePalettes = [
        [0x529a4f, 0x428046], // xanh la chuan - tuoi, can bang (khong lanh gat nua)
        [0x69a659, 0x568e52], // xanh sang non
        [0xc9822f, 0xa8631f], // cam thu - autumn (giu nguyen, mau trang tri chu dich)
        [0xb5451f, 0x8f3417], // do cam dam - autumn dam (giu nguyen, mau trang tri chu dich)
        [0x437052, 0x345c42], // xanh rung dam
      ];
      const trunkGeoBase = new THREE.CylinderGeometry(0.03, 0.045, 0.42, 6);
      const foliageGeoA = new THREE.ConeGeometry(0.3, 0.5, 8);
      const foliageGeoB = new THREE.ConeGeometry(0.22, 0.42, 8);
      const canopyGeo = new THREE.SphereGeometry(0.34, 8, 7);
      const shrubGeo = new THREE.SphereGeometry(0.22, 7, 6);
      const tallTrunkGeo = new THREE.CylinderGeometry(0.028, 0.06, 0.95, 6);
      const tallTierGeo = new THREE.ConeGeometry(0.26, 0.42, 7);
      // Toi uu: dung 1 pool material CO SAN (5 bang mau x 2 = 10 material) thay
      // vi tao moi THREE.MeshStandardMaterial cho MOI cay procedural (truoc day
      // moi cay tallpine/normal tao 2 material rieng -> hang nghin material rac,
      // ton bo nho + ep trinh duyet bien dich lai shader nhieu lan khong can thiet).
      const foliageMatPool = foliagePalettes.map((p) => [
        new THREE.MeshStandardMaterial({ color: p[0], roughness: 0.85 }),
        new THREE.MeshStandardMaterial({ color: p[1], roughness: 0.85 }),
      ]);

      const swayItems = [];
      function makeTree(px, pz, scale, forceKind) {
        // Theo yeu cau: bo het cay "ve tay" bang hinh khoi three.js (cone/sphere)
        // -> chi con 2 loai: cay 3D that (birch/maple) va khom hoa 3D that.
        // forceKind='shrub' (tu doan kenh nuoc) gio se ra khom hoa that.
        // forceKind='green' -> cay la xanh (dung rieng quanh Khu Tam Linh).
        if (forceKind === "shrub") {
          return makeRealModelPlaceholder(
            px,
            pz,
            scale,
            "flower",
            scale * 0.5,
            0,
          );
        }
        if (forceKind === "green") {
          return makeRealModelPlaceholder(
            px,
            pz,
            scale,
            "birchGreen",
            scale * 0.32,
            0,
          );
        }
        // Theo yeu cau: bo mau la vang/do (autumn), toan bo cay dung ban la
        // xanh (birchGreen/mapleGreen) - van giu 2 kieu hinh dang (birch/maple)
        // de rung co chut da dang, chi khac mau la
        const isMaple = Math.random() < 0.05;
        return makeRealModelPlaceholder(
          px,
          pz,
          scale,
          isMaple ? "mapleGreen" : "birchGreen",
          scale * 0.32,
          0,
        );
      }
      function makeTree_OLD_UNUSED(px, pz, scale, forceKind) {
        const group = new THREE.Group();
        const roll = Math.random();
        // Da phan cay la model 3D that (Birch/Maple, be gui) - 'realtree3d';
        // giu lai mot it 'tallpine'/'normal' procedural de tao chieu cao/mau
        // sac da dang va do nhe cho nhung vung rung rat day (vien ranh gioi)
        const kind =
          forceKind ||
          (roll < 0.1
            ? "tallpine"
            : roll < 0.16
              ? "shrub"
              : roll < 0.22
                ? "normal"
                : "realtree3d");
        if (kind === "realtree3d") {
          // model goc cao ~6-7m (ty le that ngoai doi) -> nhan he so nho de
          // khop voi ty le "scale" cua he thong cay procedural hien tai (~1-3m)
          const isMaple = Math.random() < 0.5;
          return makeRealModelPlaceholder(
            px,
            pz,
            scale,
            isMaple ? "maple" : "birch",
            scale * 0.32,
            0,
          );
        }
        if (kind === "realtree") {
          return makeRealTree(px, pz, scale);
        }
        if (kind === "shrub" && Math.random() < 0.55) {
          return makeRealModelPlaceholder(
            px,
            pz,
            scale,
            "flower",
            scale * 0.5,
            0,
          );
        }
        const [foliageMatA, foliageMatB] =
          foliageMatPool[Math.floor(Math.random() * foliageMatPool.length)];

        if (kind === "shrub") {
          const bush = new THREE.Mesh(shrubGeo, foliageMatA);
          bush.position.y = 0.16 * scale;
          bush.scale.set(scale * 1.15, scale * 0.75, scale * 1.15);
          bush.castShadow = true;
          group.add(bush);
          group.position.set(px, 0, pz);
          scene.add(group);
          addContactShadow(px, pz, scale * 0.3, 0.32);
          swayItems.push({
            group,
            f1: bush,
            f2: bush,
            phase: Math.random() * Math.PI * 2,
            amp: 0.03 + Math.random() * 0.02,
          });
          return group;
        }

        if (kind === "tallpine") {
          const trunk = new THREE.Mesh(tallTrunkGeo, trunkMat);
          trunk.position.y = 0.46 * scale;
          trunk.scale.set(scale * 0.8, scale * 1.35, scale * 0.8);
          trunk.castShadow = true;
          group.add(trunk);
          const tierYs = [0.62, 0.86, 1.1];
          let midMesh = null,
            topMesh = null;
          tierYs.forEach((ty, ti) => {
            const m = new THREE.Mesh(
              tallTierGeo,
              ti % 2 === 0 ? foliageMatA : foliageMatB,
            );
            const s = scale * (1.12 - ti * 0.2);
            m.position.y = ty * scale;
            m.scale.set(s, s, s);
            m.castShadow = true;
            group.add(m);
            if (ti === 1) midMesh = m;
            if (ti === 2) topMesh = m;
          });
          group.position.set(px, 0, pz);
          scene.add(group);
          addContactShadow(px, pz, scale * 0.32, 0.4);
          swayItems.push({
            group,
            f1: midMesh,
            f2: topMesh,
            phase: Math.random() * Math.PI * 2,
            amp: 0.045 + Math.random() * 0.025,
          });
          return group;
        }

        const trunk = new THREE.Mesh(trunkGeoBase, trunkMat);
        trunk.position.y = 0.21 * scale;
        trunk.scale.set(scale, scale, scale);
        trunk.castShadow = true;
        group.add(trunk);
        const broadleaf = Math.random() < 0.4;
        const f1 = new THREE.Mesh(
          broadleaf ? canopyGeo : foliageGeoA,
          foliageMatA,
        );
        f1.position.y = (broadleaf ? 0.62 : 0.56) * scale;
        f1.scale.set(scale, scale, scale);
        f1.castShadow = true;
        group.add(f1);
        const f2 = new THREE.Mesh(foliageGeoB, foliageMatB);
        f2.position.y = 0.82 * scale;
        f2.scale.set(scale * 0.85, scale * 0.9, scale * 0.85);
        f2.castShadow = true;
        group.add(f2);
        group.position.set(px, 0, pz);
        scene.add(group);
        addContactShadow(
          px,
          pz,
          scale * 0.34 * (kind === "tallpine" ? 0.8 : 1),
          0.4,
        );
        swayItems.push({
          group,
          f1,
          f2,
          phase: Math.random() * Math.PI * 2,
          amp: 0.05 + Math.random() * 0.03,
        });
        return group;
      }

      // cay trong Khu Tam Linh (quanh ho, tranh dam vao mat nuoc) - doi sang cay
      // LA XANH (khong dung do/vang nua) theo yeu cau, vi day la khu vuc gan
      // ghe da nghi chan ke khu H
      const parkTreeSpotsMap = [
        [20, 20],
        [420, 20],
        [20, 132],
        [420, 132],
        [70, 70],
        [370, 82],
      ];
      parkTreeSpotsMap.forEach(([dx, dy]) => {
        const mx = SPIRIT_PARK.x + dx,
          my = SPIRIT_PARK.y + dy;
        const dist = Math.hypot(mx - LAKE.cx, my - LAKE.cy);
        if (dist < LAKE.r + 30) return;
        makeTree(wx(mx), wz(my), 0.85 + Math.random() * 0.35, "green");
      });

      // rung bao quanh toan bo lo dat - nhieu vong cay mat do khac nhau de tao khu rung
      // thua bao boc tu 4 phia (khong chi mot khoang trong nhu truoc), cao thap dan xen
      (function scatterForestBelt() {
        const cx0 = BOUNDARY.reduce((s, p) => s + p[0], 0) / BOUNDARY.length;
        const cy0 = BOUNDARY.reduce((s, p) => s + p[1], 0) / BOUNDARY.length;
        const rings = [
          {
            offset: 35,
            jitter: 22,
            spacing: 165,
            scaleMin: 0.7,
            scaleMax: 1.2,
          },
          {
            offset: 105,
            jitter: 28,
            spacing: 150,
            scaleMin: 1.0,
            scaleMax: 1.9,
          },
        ];
        for (let i = 0; i < BOUNDARY.length; i++) {
          const p1 = BOUNDARY[i],
            p2 = BOUNDARY[(i + 1) % BOUNDARY.length];
          // bo hoan toan hang cay doc theo canh co 2 cong ra vao (canh phia
          // truoc, y ~1600) - khong rai cay tren toan bo doan duong nay nua
          if (Math.abs(p1[1] - 1600) < 5 && Math.abs(p2[1] - 1600) < 5)
            continue;
          const len = Math.hypot(p2[0] - p1[0], p2[1] - p1[1]);
          let nx = -(p2[1] - p1[1]),
            ny = p2[0] - p1[0];
          const nl = Math.hypot(nx, ny) || 1;
          nx /= nl;
          ny /= nl;
          const midx = (p1[0] + p2[0]) / 2,
            midy = (p1[1] + p2[1]) / 2;
          if (nx * (midx - cx0) + ny * (midy - cy0) < 0) {
            nx = -nx;
            ny = -ny;
          }
          rings.forEach((ring) => {
            const segs = Math.max(1, Math.floor(len / ring.spacing));
            for (let s = 0; s < segs; s++) {
              const t = (s + 0.5) / segs;
              const mx = p1[0] + (p2[0] - p1[0]) * t;
              const my = p1[1] + (p2[1] - p1[1]) * t;
              const ox =
                mx + nx * ring.offset + (Math.random() - 0.5) * ring.jitter;
              const oy =
                my + ny * ring.offset + (Math.random() - 0.5) * ring.jitter;
              if (Math.hypot(ox - MAP_GATE.x, oy - MAP_GATE.y) < 95) continue;
              if (Math.hypot(ox - SECONDARY_GATE.x, oy - SECONDARY_GATE.y) < 95)
                continue;
              // duong truoc 2 cong (noi giua MAP_GATE va SECONDARY_GATE, cung
              // truc y~1560) - khong rai cay tren doan duong nay
              if (
                oy > 1560 - 45 &&
                oy < 1560 + 70 &&
                ox > MAP_GATE.x - 70 &&
                ox < SECONDARY_GATE.x + 70
              )
                continue;
              const scale =
                ring.scaleMin + Math.random() * (ring.scaleMax - ring.scaleMin);
              makeTree(wx(ox), wz(oy), scale);
            }
          });
        }
      })();

      /* ------------------------------------------------------------------
       * Kenh nuoc chay doc dai co trong ben trai (giua vien cay cheo phia
       * Tay va duong noi bo canh khu A/D/F/H) - nam BEN TRONG ranh gioi
       * khu mo, co thanh chan (tuong thap) doc 2 ben bo de an toan, va

       * ------------------------------------------------------------------ */
      const CANAL = { x1: -58, y1: 150, x2: 2, y2: 1480 }; // toa do "raw", nam trong dai co trong giua vien cay cheo (Tay) va duong noi khu A/D/F/H
      let canalWaterUniforms = null;
      (function buildCanal() {
        const CANAL_CURB_THICK = 0.09;
        const CANAL_CURB_H = 0.26; // thanh chan nhoi cao hon mat dat - lam lan can an toan
        const CANAL_BASIN_DEPTH = 0.3; // long kenh khoet sau xuong duoi mat dat

        const xW = wx(CANAL.x1),
          xE = wx(CANAL.x2); // xW < xE
        const zN = wz(CANAL.y1),
          zS = wz(CANAL.y2); // zN < zS
        const canalWidth = xE - xW;
        const canalLen = zS - zN;
        const centerX = (xW + xE) / 2,
          centerZ = (zN + zS) / 2;
        const curbTopY = GROUND_Y + CANAL_CURB_H;
        const basinFloorY = GROUND_Y - CANAL_BASIN_DEPTH;

        const canalStoneTex = makeStoneTexture();
        const canalWallMat = new THREE.MeshStandardMaterial({

        // long kenh - nen day kenh thut xuong duoi mat dat
        const floorGeo = new THREE.BoxGeometry(

        floorMesh.receiveShadow = true;
        scene.add(floorMesh);

        // 2 vach thanh chay doc theo kenh (tuong chan + lan can an toan, tu day len mep tren)
        [xW + CANAL_CURB_THICK / 2, xE - CANAL_CURB_THICK / 2].forEach(
          (wallX) => {

            const wallGeo = new THREE.BoxGeometry(

            wallMesh.castShadow = true;

            scene.add(wallMesh);

            const capGeo = new THREE.BoxGeometry(

            );
            const capMesh = new THREE.Mesh(capGeo, canalCapMat);
            capMesh.position.set(wallX, curbTopY + 0.02, centerZ);
            capMesh.receiveShadow = true;
            scene.add(capMesh);
          },
        );

        // be be 2 dau Bac/Nam - dong kin long kenh
        [zN, zS].forEach((endZ) => {
          const endGeo = new THREE.BoxGeometry(
            canalWidth,
            curbTopY - basinFloorY,
            CANAL_CURB_THICK,
          );
          const endMesh = new THREE.Mesh(endGeo, canalWallMat);
          endMesh.position.set(centerX, (curbTopY + basinFloorY) / 2, endZ);
          endMesh.castShadow = true;
          endMesh.receiveShadow = true;
          scene.add(endMesh);
        });

        // mat nuoc kenh - dang trai dai, gon song nhe chay doc theo chieu dai kenh
        canalWaterUniforms = {
          uTime: { value: 0 },
          uDeep: { value: new THREE.Color(0x1c7fa0) },
          uShallow: { value: new THREE.Color(0x7fd4e8) },
        };
        const canalWaterMat = new THREE.ShaderMaterial({
          uniforms: canalWaterUniforms,
          transparent: true,
          vertexShader: `
      uniform float uTime;
      varying vec2 vXy;
      void main(){
        vXy = position.xy;
        float ripple = sin(position.y*2.2 - uTime*1.3)*0.01 + sin(position.x*6.0+uTime*0.7)*0.006;
        vec3 p = position + vec3(0.0,0.0, ripple);
        gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
      }`,
          fragmentShader: `
      uniform float uTime; uniform vec3 uDeep; uniform vec3 uShallow;
      varying vec2 vXy;
      float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        float bank = abs(vXy.x);
        vec3 base = mix(uShallow, uDeep, smoothstep(0.0, 1.0, bank*2.0));
        vec2 cell = floor(vXy*14.0 + vec2(0.0, uTime*0.25));
        float spark = hash(cell);
        float twinkle = step(0.986, spark) * (0.5+0.5*sin(uTime*6.0+spark*40.0));
        vec3 col = base + vec3(twinkle*0.85);
        gl_FragColor = vec4(col, 0.92);
      }`,
        });
        const waterW = canalWidth - CANAL_CURB_THICK * 2 - 0.03;
        const canalWaterGeo = new THREE.PlaneGeometry(waterW, canalLen);
        const canalWaterMesh = new THREE.Mesh(canalWaterGeo, canalWaterMat);
        canalWaterMesh.rotation.x = -Math.PI / 2;
        canalWaterMesh.position.set(centerX, curbTopY - 0.03, centerZ);
        scene.add(canalWaterMesh);

        // bui cay + cay nho moc quanh kenh, ca 2 ben bo, so le tu nhien, tranh dam vao thanh
        const bushRows = Math.floor(canalLen / 7);
        for (let i = 0; i < bushRows; i++) {
          const t = (i + 0.5) / bushRows;
          const z = zN + canalLen * t + (Math.random() - 0.5) * 0.25;
          // ben ngoai (phia Tay, giap vien cay/ranh gioi) - day bui cay hon
          if (Math.random() < 0.5) {
            const bx = xW - 0.08 - Math.random() * 0.22;
            makeTree(bx, z, 0.55 + Math.random() * 0.45, "shrub");
          }
          // ben trong (phia Dong, giap duong noi bo / khu mo) - thua hon
          if (Math.random() < 0.3) {
            const bx2 = xE + 0.15 + Math.random() * 0.3;
            makeTree(bx2, z, 0.5 + Math.random() * 0.35, "shrub");
          }
        }
      })();
      (function scatterGrassClumps() {
        function pointInBoundary(x, y) {
          let inside = false;
          for (
            let i = 0, j = BOUNDARY.length - 1;
            i < BOUNDARY.length;
            j = i++
          ) {
            const xi = BOUNDARY[i][0],
              yi = BOUNDARY[i][1],
              xj = BOUNDARY[j][0],
              yj = BOUNDARY[j][1];
            const intersect =
              yi > y !== yj > y && x < ((xj - xi) * (y - yi)) / (yj - yi) + xi;
            if (intersect) inside = !inside;
          }
          return inside;
        }
        function isBlocked(x, y) {
          for (const key in LAYOUT) {
            const L = LAYOUT[key];
            if (
              x > L.x - 12 &&
              x < L.x + L.w + 12 &&
              y > L.y - 12 &&
              y < L.y + L.h + 12
            )
              return true;
          }
          for (const r of ROADS) {
            if (
              x > r.x - 6 &&
              x < r.x + r.w + 6 &&
              y > r.y - 6 &&
              y < r.y + r.h + 6
            )
              return true;
          }
          if (
            x > SPIRIT_PARK.x - 15 &&
            x < SPIRIT_PARK.x + SPIRIT_PARK.w + 15 &&
            y > SPIRIT_PARK.y - 15 &&
            y < SPIRIT_PARK.y + SPIRIT_PARK.h + 15
          )
            return true;
          if (Math.hypot(x - MAP_GATE.x, y - MAP_GATE.y) < 60) return true;
          if (Math.hypot(x - SECONDARY_GATE.x, y - SECONDARY_GATE.y) < 60)
            return true;
          return false;
        }
        const bladeTex = makeGrassBladeTexture();
        const p1 = new THREE.PlaneGeometry(0.5, 0.4);
        p1.translate(0, 0.2, 0);
        const p2 = p1.clone();
        p2.rotateY(Math.PI / 2);
        const clumpGeo = THREE.BufferGeometryUtils.mergeBufferGeometries([
          p1,
          p2,
        ]);
        const clumpMat = new THREE.MeshStandardMaterial({
          map: bladeTex,
          transparent: true,
          alphaTest: 0.35,
          side: THREE.DoubleSide,
          roughness: 0.9,
        });
        const maxClumps = 260;
        const clumpMesh = new THREE.InstancedMesh(
          clumpGeo,
          clumpMat,
          maxClumps,
        );
        const dummyC = new THREE.Object3D();
        let placed = 0,
          attempts = 0;
        const clumpItems = [];
        while (placed < maxClumps && attempts < maxClumps * 12) {
          attempts++;
          const x = -80 + Math.random() * 1740;
          const y = -40 + Math.random() * 1640;
          if (!pointInBoundary(x, y) || isBlocked(x, y)) continue;
          const s = 0.7 + Math.random() * 0.9;
          dummyC.position.set(wx(x), 0, wz(y));
          dummyC.rotation.set(0, Math.random() * Math.PI * 2, 0);
          dummyC.scale.set(s, s, s);
          dummyC.updateMatrix();
          clumpMesh.setMatrixAt(placed, dummyC.matrix);
          clumpItems.push({
            index: placed,
            base: dummyC.rotation.y,
            x: wx(x),
            z: wz(y),
            s,
            phase: Math.random() * Math.PI * 2,
          });
          placed++;
        }
        clumpMesh.count = placed;
        clumpMesh.instanceMatrix.needsUpdate = true;
        scene.add(clumpMesh);

        swayItems.push({
          isClumpField: true,
          update(t) {
            clumpItems.forEach((ci) => {
              const wob = Math.sin(t * 1.1 + ci.phase) * 0.12;
              dummyC.position.set(ci.x, 0, ci.z);
              dummyC.rotation.set(0, ci.base + wob * 0.3, 0);
              dummyC.scale.set(ci.s, ci.s, ci.s);
              dummyC.updateMatrix();
              clumpMesh.setMatrixAt(ci.index, dummyC.matrix);
            });
            clumpMesh.instanceMatrix.needsUpdate = true;
          },
        });
      })();

      /* ------------------------------------------------------------------
       * Den da (stone lantern) - dat canh cong, ben ho, dung tinh than da my
       * nghe cua thuong hieu
       * ------------------------------------------------------------------ */
      const lanternStoneMat = new THREE.MeshStandardMaterial({
        color: 0x8f9083,
        map: stoneTex,
        roughness: 0.8,
      });
      function buildLantern(px, pz) {
        const g = new THREE.Group();

          new THREE.CylinderGeometry(0.11, 0.13, 0.12, 6),

        g.add(base);
        const pillar = new THREE.Mesh(

        g.add(pillar);
        const box = new THREE.Mesh(

        g.add(lightCore);
        g.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
            o.receiveShadow = true;

        });
        g.position.set(px, 0, pz);
        scene.add(g);
      }
      [
        [LAKE.cx - LAKE.r - 20, LAKE.cy],
        [LAKE.cx + LAKE.r + 20, LAKE.cy],
        [LAKE.cx, LAKE.cy - LAKE.r - 16],
        [LAKE.cx, LAKE.cy + LAKE.r + 16],
      ].forEach(([mx, my]) => buildLantern(wx(mx), wz(my)));

      // unit tomb geometry - mo don kieu da xam hien dai (3 bac them + ban tho + bia
      // da doc + mai che nghieng), tham chieu anh mau: benh da xam, mai vat ngang,

      const step2Geo = new THREE.BoxGeometry(0.9, 0.07, 1.12);
      step2Geo.translate(0, 0.105, 0.02);

      step3Geo.translate(0, 0.175, -0.02);
      // ban tho / mat ban dat do (1050mm dai) tren cung cac bac them

      slabGeo.translate(0, 0.24, -0.16);
      // tru dung phia sau nang bia + mai

      wallGeo.translate(0, 0.21 + 0.5 / 2, -0.46);

      steleGeo.translate(0, 0.24 + 0.22, -0.435);

      const roofGeo = new THREE.BoxGeometry(0.7, 0.05, 0.5);
      roofGeo.translate(0, 0, 0.14); // dua mep truoc ra xa truc xoay de tao do nhoi khi nghieng

      roofGeo.translate(0, 0.21 + 0.5 + 0.05, -0.5);

      const tombGeo = THREE.BufferGeometryUtils.mergeBufferGeometries([
        step1Geo,
        step2Geo,
        step3Geo,

        wallGeo,
        steleGeo,

      // mau rieng theo khu: A/B/D/E = vang dat SANG (da hoa cuong vang), F/G/H = trang xam SANG (da hoa cuong trang) - khong choi nhung sang ro
      // Chat lieu da THAT (be gui bo texture Gravestones PBR - chi lay chat lieu,
      // KHONG lay hinh khoi cua bo do vi khong dung kieu mo Viet Nam) ap len
      // dung hinh khoi mo hien tai. Mau tint EARTH_YELLOW/OFFWHITE_GRAY nhan
      // (multiply) len anh albedo that de van phan biet duoc khu ma khong mat

      const graniteRealNormal = loadRepeatTex(

      const graniteRealRough = loadRepeatTex(

      const graniteRealMetal = loadRepeatTex(

      const EARTH_YELLOW = 0xdfe4e6; // tint gan trang - de anh da hoa cuong xam xanh + vang that hien ro, khong bi toi/den
      const OFFWHITE_GRAY = 0xe6eaec; // tint gan trang, hoi lanh hon mot chut - phan biet nhe giua cac khu
      const tombMatYellow = new THREE.MeshStandardMaterial({
        color: EARTH_YELLOW,
        map: graniteRealAlbedo,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.75, 0.75),
        roughnessMap: graniteRealRough,
        roughness: 0.75,
        metalnessMap: graniteRealMetal,
        metalness: 0.12,
        envMapIntensity: 0.8,
      });
      const tombMatGray = new THREE.MeshStandardMaterial({
        color: OFFWHITE_GRAY,
        map: graniteRealAlbedo,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.75, 0.75),
        roughnessMap: graniteRealRough,
        roughness: 0.75,
        metalnessMap: graniteRealMetal,
        metalness: 0.12,
        envMapIntensity: 0.8,
      });
      // Khu A, F: mo mau vang sang trong, khong choi (tone vang dong/vang champagne dam,
      // khong phai vang chanh). Khu D, H: mo mau do gach tram, khong choi (do dat nung/
      // terracotta tram, khong phai do tuoi/do sang). Van dung chung 1 bo texture da

      // Khu A, F: mo mau vang sa thach am (dung texture sandstone rieng, giong

      // khong can van da granite, chi giu chut normal map de co do nham nhe.
      // Khu A, F: mo mau vang sa thach am, dung MAU PHANG (khong dung anh
      // texture rieng nua - texture moi bi loi tai/hien mau den o mot so may,
      // nen chuyen ve mau phang dang tin cay giong cach lam mo hong o duoi,
      // van giu normal map da that (graniteRealNormal) de co do nham/chieu sau
      // nhe, nhung khong con phu thuoc anh albedo ngoai nua).
      const tombMatGold = new THREE.MeshStandardMaterial({
        color: 0xd1a76e,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.35, 0.35),
        roughness: 0.72,
        metalness: 0.03,

      });
      const tombMatBrickRed = new THREE.MeshStandardMaterial({

        normalScale: new THREE.Vector2(0.25, 0.25),

      const ZONE_TOMB_MAT = {

      // ngoi sao vang nho tren ban tho (dang octahedron det, mo phong ngoi sao)
      const starGeo = new THREE.OctahedronGeometry(0.075, 0);
      starGeo.scale(1, 0.35, 1);
      starGeo.translate(0, 0.24 + 0.03 + 0.04, 0.02);
      const starMat = new THREE.MeshStandardMaterial({

      // khung anh tho trang nho tren bia
      const photoGeo = new THREE.BoxGeometry(0.18, 0.24, 0.012);
      photoGeo.translate(0, 0.24 + 0.22, -0.42);
      const photoMat = new THREE.MeshStandardMaterial({

        roughness: 0.5,
      });

      // collect cells per zone, build instanced meshes (Khu C - lo gia toc dung bo cuc rieng, xem buildFamilyClusters)
      let totalCells = 0;
      const zoneCellCounts = {};
      const allCells = [];
      Object.keys(LAYOUT).forEach((key) => {
        if (key === "C") return;
