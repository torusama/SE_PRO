<!doctype html>
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Bản đồ 3D tương tác - Cinematic Realism</title>
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        font-family: "Be Vietnam Pro", "Inter", system-ui, sans-serif;
        background: #0e1a1f;
      }
      #canvasWrap {
        position: absolute;
        inset: 0;
      }
      #canvasWrap canvas {
        display: block;
      }
      #fade {
        position: absolute;
        inset: 0;
        background: #0e1a1f;
        z-index: 20;
        pointer-events: none;
        transition: opacity 1.4s ease;
      }
      #fade.hide {
        opacity: 0;
      }
      #topbar {
        position: absolute;
        top: 0;
        left: 0;
        right: 0;
        padding: 14px 18px;
        display: flex;
        align-items: center;
        justify-content: space-between;
        background: linear-gradient(rgba(10, 15, 10, 0.6), rgba(10, 15, 10, 0));
        pointer-events: none;
        z-index: 5;
      }
      #topbar h1 {
        color: #fff;
        font-size: 16px;
        font-weight: 600;
        margin: 0;
        text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
        letter-spacing: 0.2px;
      }
      #topbar span {
        display: block;
        color: #e7e2cf;
        font-size: 11px;
        font-weight: 400;
        margin-top: 2px;
        text-shadow: 0 1px 3px rgba(0, 0, 0, 0.6);
      }
      #legend {
        position: absolute;
        top: 14px;
        right: 14px;
        width: 230px;
        max-height: calc(100% - 100px);
        overflow: auto;
        background: rgba(255, 255, 255, 0.72);
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
        padding: 12px;
        z-index: 5;
        backdrop-filter: blur(6px);
      }
      #legend h2 {
        font-size: 13px;
        margin: 0 0 8px;
        color: #222;
      }
      .zbtn {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        background: none;
        border: none;
        text-align: left;
        padding: 6px 4px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 12.5px;
        color: #222;
      }
      .zbtn:hover {
        background: #f1efe6;
      }
      .zbtn .sw {
        width: 12px;
        height: 12px;
        border-radius: 3px;
        flex: none;
        box-shadow: inset 0 0 0 1px rgba(0, 0, 0, 0.15);
      }
      .zbtn .cnt {
        margin-left: auto;
        color: #888;
        font-size: 11px;
      }
      #controls {
        position: absolute;
        bottom: 16px;
        right: 14px;
        display: flex;
        flex-direction: column;
        gap: 8px;
        z-index: 5;
      }
      .ctrlbtn {
        width: 40px;
        height: 40px;
        border-radius: 10px;
        background: rgba(255, 255, 255, 0.95);
        border: none;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.28);
        font-size: 18px;
        cursor: pointer;
        color: #333;
      }
      .ctrlbtn.active {
        background: #2d9d6f;
        color: #fff;
      }
      #info {
        position: absolute;
        left: 14px;
        bottom: 16px;
        max-width: 300px;
        background: rgba(255, 255, 255, 0.72);
        border-radius: 12px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.28);
        padding: 14px 16px;
        z-index: 5;
        display: none;
        backdrop-filter: blur(6px);
      }
      #backBtn3d {
        position: absolute;
        top: 14px;
        left: 14px;
        z-index: 6;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        border: none;
        background: rgba(8, 13, 26, 0.72);
        backdrop-filter: blur(8px);
        color: #eafff8;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s ease;
      }
      #backBtn3d:hover {
        background: rgba(0, 229, 196, 0.28);
      }
      #info h3 {
        margin: 0 0 4px;
        font-size: 14px;
      }
      #info p {
        margin: 0;
        font-size: 12px;
        color: #555;
        line-height: 1.6;
      }
      #hint {
        position: absolute;
        left: 14px;
        top: 60px;
        background: rgba(0, 0, 0, 0.5);
        color: #fff;
        font-size: 11.5px;
        padding: 9px 11px;
        border-radius: 10px;
        z-index: 5;

        line-height: 1.6;

      }
      .label {
        color: #1c1c1a;
        background: rgba(255, 255, 255, 0.9);

        font-size: 11.5px;

        cursor: pointer;
        box-shadow: 0 2px 6px rgba(0, 0, 0, 0.25);
      }
      .label.gate {
        background: rgba(181, 67, 44, 0.94);
        color: #fff;
      }
      .label.poi {
        background: rgba(20, 80, 70, 0.88);
        color: #fff;
        font-weight: 500;
      }

    <div id="fade"></div>

    <div id="controls">

    <script>
      /* ------------------------------------------------------------------
       * Cau noi voi trang React ben ngoai (khi trang nay duoc nhung trong
       * <iframe> cua trang "Ban do 3D"): bao "back" de trang cha dieu huong
       * ve lai ban do 2D (va go bo iframe nay khoi DOM de dung han render
       * 3D, tranh ton tai nguyen khi khong xem nua).
       * ------------------------------------------------------------------ */
      function goBackToMap2D() {
        try {
          if (window.parent && window.parent !== window) {
            window.parent.postMessage({ type: "vpv3d:back" }, "*");
            return;
          }
        } catch (e) {}
        // fallback khi mo truc tiep file nay (khong o trong iframe)
        window.history.back();
      }

      /* ------------------------------------------------------------------
       * Du lieu bo cuc lay dung theo du lieu that cua trang "mua ban mo
       * phan" (frontend/src/lib/cemeteryMapLayout.ts + cemeteryMapVisuals.ts)
       * trong du an - toa do khu, duong, cong, khu tam linh deu khop 1:1.
       * ------------------------------------------------------------------ */
      const SC = 0.02;
      const PLATFORM_H = 0.05;

      // Đồng bộ 1:1 với dữ liệu thật của trang "mua bán mộ phần"
      // (frontend/src/lib/cemeteryMapLayout.ts - CEMETERY_ZONES / ZONE_META):

            "Khu F mật độ cao, diện tích mỗi lô nhỏ gọn, mức giá tối ưu cho ngân sách vừa phải.",

          blurb:
            "Khu H bố trí các mộ đơn lẻ, phù hợp nhu cầu an táng cá nhân với chi phí hợp lý.",

        },
      };

      const LAYOUT = {
        A: { x: 100, y: 60, w: 330, h: 250, cols: 6, rows: 7, gap: 6 },
        B: { x: 490, y: 60, w: 330, h: 250, cols: 7, rows: 6, gap: 6 },
        D: { x: 100, y: 380, w: 330, h: 250, cols: 6, rows: 8, gap: 5 },

        F: { x: 100, y: 930, w: 330, h: 250, cols: 8, rows: 6, gap: 5 },
        G: { x: 490, y: 930, w: 330, h: 250, cols: 6, rows: 7, gap: 6 },
        H: { x: 100, y: 1250, w: 330, h: 250, cols: 7, rows: 6, gap: 6 },
        C: {
          x: 1000,
          y: 60,
          w: 620,
          h: 1440,
          cols: 10,
          rows: 20,
          gap: 8,
          groups: { cols: 1, rows: 4, gap: 80 },

      const ROADS = [
        { x: 880, y: 15, w: 30, h: 1535 },
        { x: 50, y: 15, w: 26, h: 1535 },
        { x: 445, y: 15, w: 30, h: 663 },
        { x: 445, y: 874, w: 30, h: 650 },
        { x: 1634, y: 15, w: 26, h: 1535 },
        { x: 50, y: 1524, w: 1610, h: 26 },
        { x: 50, y: 15, w: 1610, h: 26 },
        { x: 50, y: 332, w: 860, h: 26 },
        { x: 50, y: 652, w: 860, h: 26 },
        { x: 50, y: 874, w: 860, h: 26 },
        { x: 50, y: 1202, w: 860, h: 26 },
        { x: 880, y: 767, w: 780, h: 26 },
        { x: 880, y: 387, w: 780, h: 26 },
        { x: 880, y: 1147, w: 780, h: 26 },
        { x: 1297, y: 15, w: 26, h: 1535 },
      ];

      const SPIRIT_PARK = { x: 240, y: 700, w: 440, h: 152 };
      const LAKE = { cx: 460, cy: 776, r: 58 };
      const MAP_GATE = { x: 460, y: 1560 };
      const SECONDARY_GATE = { x: 1310, y: 1560 };
      const BOUNDARY = [
        [160, -40],
        [1560, -40],
        [1660, 60],
        [1660, 1460],
        [1590, 1600],
        [960, 1600],
        [140, 1600],
        [-80, 1480],
        [-80, 160],
      ];

      function wx(x) {
        return x * SC;
      }
      function wz(y) {
        return y * SC;
      }

      function cellGrid(layout) {
        const cells = [];
        if (layout.groups) {
          const g = layout.groups;
          const colsPerG = layout.cols / g.cols,
            rowsPerG = layout.rows / g.rows;
          const gw = (layout.w - g.gap * (g.cols - 1)) / g.cols;
          const gh = (layout.h - g.gap * (g.rows - 1)) / g.rows;
          const cw = (gw - layout.gap * (colsPerG - 1)) / colsPerG;
          const ch = (gh - layout.gap * (rowsPerG - 1)) / rowsPerG;
          for (let gr = 0; gr < g.rows; gr++) {
            for (let gc = 0; gc < g.cols; gc++) {
              const gx = layout.x + gc * (gw + g.gap);
              const gy = layout.y + gr * (gh + g.gap);
              for (let r = 0; r < rowsPerG; r++) {
                for (let c = 0; c < colsPerG; c++) {
                  cells.push({
                    cx: gx + c * (cw + layout.gap),
                    cy: gy + r * (ch + layout.gap),
                    cw,
                    ch,
                  });
                }
              }
            }
          }
        } else {
          const cw = (layout.w - layout.gap * (layout.cols - 1)) / layout.cols;
          const ch = (layout.h - layout.gap * (layout.rows - 1)) / layout.rows;
          for (let r = 0; r < layout.rows; r++) {
            for (let c = 0; c < layout.cols; c++) {
              cells.push({
                cx: layout.x + c * (cw + layout.gap),
                cy: layout.y + r * (ch + layout.gap),
                cw,
                ch,
              });
            }
          }
        }
        return cells;
      }

      function groupBackdrops(layout) {
        const pad = 14;
        if (!layout.groups)
          return [
            {
              x: layout.x - pad,
              y: layout.y - pad,
              w: layout.w + 2 * pad,
              h: layout.h + 2 * pad,
            },
          ];
        const g = layout.groups;
        const gw = (layout.w - g.gap * (g.cols - 1)) / g.cols;
        const gh = (layout.h - g.gap * (g.rows - 1)) / g.rows;
        const out = [];
        for (let gr = 0; gr < g.rows; gr++) {
          for (let gc = 0; gc < g.cols; gc++) {
            out.push({
              x: layout.x + gc * (gw + g.gap) - pad,
              y: layout.y + gr * (gh + g.gap) - pad,
              w: gw + 2 * pad,
              h: gh + 2 * pad,
            });
          }
        }
        return out;
      }

      /* ------------------------------------------------------------------
       * Procedural textures (khong can fetch anh ngoai - tu ve bang canvas)
       * ------------------------------------------------------------------ */
      function makeGrassTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#5c8a44";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 4200; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          const shade = 30 + Math.random() * 70;
          const g = Math.random() > 0.5 ? 1 : -1;
          ctx.fillStyle = `rgba(${70 + g * 14},${130 + shade * 0.55},${50 + g * 10},0.55)`;
          ctx.fillRect(x, y, 1.4, 3.2);
        }
        // diem la kho / co ha am de tao cam giac tu nhien, am ap thay vi troc trang
        for (let i = 0; i < 260; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          ctx.fillStyle = `rgba(${170 + Math.random() * 40},${110 + Math.random() * 40},${40 + Math.random() * 30},0.5)`;
          ctx.fillRect(x, y, 2 + Math.random() * 2, 1.4);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(50, 50);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeGraniteTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#5b6870";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 2600; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          const v = Math.random() * 34;
          ctx.fillStyle = `rgba(${86 + v},${98 + v},${104 + v},0.5)`;
          ctx.fillRect(
            x,
            y,
            Math.random() * 1.6 + 0.4,
            Math.random() * 1.6 + 0.4,
          );
        }
        for (let i = 0; i < 160; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          ctx.fillStyle = "rgba(225,230,232,0.4)";
          ctx.fillRect(x, y, 1, 1);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      // texture da hoa cuong SANG MAU (nen trang nga, lom dom nhat/toi nhe) - dung cho
      // mo cac khu (thay the ban toi 5b6870 qua dam lam an het mau nen khi nhan vao)
      function makeGraniteTextureBright() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#ece8de";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 3000; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          const v = Math.random() * 40;
          if (Math.random() < 0.5) {
            ctx.fillStyle = `rgba(${150 - v},${148 - v},${142 - v},0.3)`;
          } else {
            ctx.fillStyle = "rgba(255,253,247,0.55)";
          }
          ctx.fillRect(
            x,
            y,
            Math.random() * 1.6 + 0.4,
            Math.random() * 1.6 + 0.4,
          );
        }
        for (let i = 0; i < 170; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          ctx.fillStyle = "rgba(96,94,88,0.22)";
          ctx.fillRect(x, y, 1, 1);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(2, 2);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeForestFloorTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#4d6b3a";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 3600; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          const shade = 20 + Math.random() * 60;
          const g = Math.random() > 0.5 ? 1 : -1;
          ctx.fillStyle = `rgba(${50 + g * 12},${95 + shade * 0.5},${38 + g * 8},0.55)`;
          ctx.fillRect(x, y, 1.5, 3.4);
        }
        for (let i = 0; i < 420; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          ctx.fillStyle = `rgba(${140 + Math.random() * 50},${95 + Math.random() * 40},${45 + Math.random() * 25},0.55)`;
          ctx.fillRect(x, y, 2.2 + Math.random() * 2, 1.6);
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(70, 70);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeGrassBladeTexture() {
        const c = document.createElement("canvas");
        c.width = 64;
        c.height = 64;
        const ctx = c.getContext("2d");
        ctx.clearRect(0, 0, 64, 64);
        for (let i = 0; i < 7; i++) {
          const bx = 5 + i * 8 + (Math.random() * 3 - 1.5);
          const hue = 88 + Math.random() * 30;
          ctx.fillStyle = `hsl(${hue},42%,${30 + Math.random() * 16}%)`;
          ctx.beginPath();
          ctx.moveTo(bx - 2.6, 64);
          ctx.quadraticCurveTo(bx - 1, 28, bx + (Math.random() * 5 - 2.5), 3);
          ctx.quadraticCurveTo(bx + 1, 28, bx + 2.6, 64);
          ctx.closePath();
          ctx.fill();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makePoolFloorTexture() {
        // gach lat day ho: nhat va it bao hoa hon vien mosaic ngoai, tao cam giac day ho co lat gach that
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const ctx = c.getContext("2d");
        const cell = 16;
        for (let y = 0; y < 128; y += cell) {
          for (let x = 0; x < 128; x += cell) {
            const hue = 195 + Math.random() * 15;
            const light = 68 + Math.random() * 18;
            ctx.fillStyle = `hsl(${hue},26%,${light}%)`;
            ctx.fillRect(x, y, cell - 1.6, cell - 1.6);
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(10, 10);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeMosaicTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const ctx = c.getContext("2d");
        const cell = 14;
        for (let y = 0; y < 128; y += cell) {
          for (let x = 0; x < 128; x += cell) {
            const hue = 200 + Math.random() * 18;
            const light = 46 + Math.random() * 24; // sang hon truoc (34-56% -> 46-70%)
            ctx.fillStyle = `hsl(${hue},30%,${light}%)`; // giam sat (58% -> 30%) de bot xanh dam, them sac xam
            ctx.fillRect(x, y, cell - 1.4, cell - 1.4);
          }
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(28, 3);
        tex.encoding = THREE.sRGBEncoding;

      }

      function makeWaterJetTexture() {
        const c = document.createElement("canvas");
        c.width = 32;
        c.height = 128;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, 128);
        g.addColorStop(0, "rgba(255,255,255,0.04)");
        g.addColorStop(0.45, "rgba(225,248,252,0.5)");
        g.addColorStop(1, "rgba(255,255,255,0.92)");

      function makeFoamTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(64, 64, 0, 64, 64, 64);
        g.addColorStop(0, "rgba(255,255,255,0.75)");
        g.addColorStop(0.6, "rgba(255,255,255,0.28)");
        g.addColorStop(1, "rgba(255,255,255,0)");

        ctx.fillRect(0, 0, 128, 128);

      function makeStoneTexture() {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        ctx.fillStyle = "#d9d3c2";
        ctx.fillRect(0, 0, 256, 256);
        for (let i = 0; i < 1400; i++) {
          const x = Math.random() * 256,
            y = Math.random() * 256;
          const v = Math.random() * 40 - 20;
          ctx.fillStyle = `rgba(${170 + v},${164 + v},${148 + v},0.35)`;
          ctx.fillRect(x, y, Math.random() * 2 + 0.5, Math.random() * 2 + 0.5);
        }
        ctx.strokeStyle = "rgba(140,132,110,0.25)";
        for (let i = 0; i < 6; i++) {
          ctx.beginPath();
          let x = Math.random() * 256,
            y = Math.random() * 256;
          ctx.moveTo(x, y);
          for (let j = 0; j < 5; j++) {
            x += (Math.random() - 0.5) * 60;
            y += (Math.random() - 0.5) * 60;
            ctx.lineTo(x, y);
          }
          ctx.stroke();
        }
        const tex = new THREE.CanvasTexture(c);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(3, 3);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }

      function makeGlowTexture(inner, outer) {
        const c = document.createElement("canvas");
        c.width = c.height = 256;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        g.addColorStop(0, inner);
        g.addColorStop(1, outer);
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 256, 256);
        return new THREE.CanvasTexture(c);
      }

      /* ------------------------------------------------------------------
       * Scene / renderer setup
       * ------------------------------------------------------------------ */
      const scene = new THREE.Scene();
      const skyTop = 0x8ec2df,
        skyBottom = 0xffe0ab;
      scene.background = new THREE.Color(0x8fcdf2);
      scene.fog = new THREE.FogExp2(0xecdcb2, 0.0055);

      const camera = new THREE.PerspectiveCamera(
        45,
        window.innerWidth / window.innerHeight,
        0.1,
        300,
      );
      const renderer = new THREE.WebGLRenderer({
        antialias: true,
        powerPreference: "high-performance",
      });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFShadowMap;
      document.getElementById("canvasWrap").appendChild(renderer.domElement);
      const MAX_ANISO = renderer.capabilities.getMaxAnisotropy
        ? renderer.capabilities.getMaxAnisotropy()
        : 4;

      /* ------------------------------------------------------------------
       * Loader cho texture that (be gui) + ham tien ich load + set repeat.
       * Cac file nam trong thu muc assets/ ke ben file HTML nay khi host web.
       * ------------------------------------------------------------------ */
      const texLoader = new THREE.TextureLoader();
      function loadRepeatTex(path, repeatX, repeatY, isColor) {
        const t = texLoader.load(path);
        t.wrapS = t.wrapT = THREE.RepeatWrapping;
        t.repeat.set(repeatX, repeatY);
        t.anisotropy = MAX_ANISO;
        if (isColor) t.encoding = THREE.sRGBEncoding;
        return t;
      }

      /* ------------------------------------------------------------------
       * Height -> Normal map helper (PBR-lite): tu mot canvas grayscale/mau,
       * suy ra ban do phap tuyen de vat lieu bat sang co chieu sau vi mo
       * thay vi phang mot mau nhu truoc (khong can tai file normal map ngoai).
       * ------------------------------------------------------------------ */
      function heightToNormalMap(srcCanvas, strength) {
        strength = strength || 1.8;
        const w = srcCanvas.width,
          h = srcCanvas.height;
        const sctx = srcCanvas.getContext("2d");
        const src = sctx.getImageData(0, 0, w, h).data;
        const lum = new Float32Array(w * h);
        for (let i = 0; i < w * h; i++) {
          const r = src[i * 4],
            g = src[i * 4 + 1],
            b = src[i * 4 + 2];
          lum[i] = (0.299 * r + 0.587 * g + 0.114 * b) / 255;
        }
        const out = document.createElement("canvas");
        out.width = w;
        out.height = h;
        const octx = out.getContext("2d");
        const img = octx.createImageData(w, h);
        const at = (x, y) => lum[((y + h) % h) * w + ((x + w) % w)];
        for (let y = 0; y < h; y++) {
          for (let x = 0; x < w; x++) {
            const l = at(x - 1, y),
              r = at(x + 1, y),
              u = at(x, y - 1),
              d = at(x, y + 1);
            let nx = (l - r) * strength,
              ny = (u - d) * strength,
              nz = 1.0;
            const len = Math.sqrt(nx * nx + ny * ny + nz * nz);
            nx /= len;
            ny /= len;
            nz /= len;
            const idx = (y * w + x) * 4;
            img.data[idx] = (nx * 0.5 + 0.5) * 255;
            img.data[idx + 1] = (ny * 0.5 + 0.5) * 255;
            img.data[idx + 2] = (nz * 0.5 + 0.5) * 255;
            img.data[idx + 3] = 255;
          }
        }
        octx.putImageData(img, 0, 0);
        const tex = new THREE.CanvasTexture(out);
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        return tex;
      }
      // gan normal map + roughness/anisotropy hoan chinh cho 1 texture PBR co san,
      // tra ve {map, normalMap} de gan truc tiep vao MeshStandardMaterial
      function upgradeToPBR(tex, repeatX, repeatY, normalStrength) {
        if (tex.image && tex.image.getContext) {
          const nrm = heightToNormalMap(tex.image, normalStrength);
          nrm.repeat.copy(tex.repeat);
          nrm.wrapS = tex.wrapS;
          nrm.wrapT = tex.wrapT;
          nrm.anisotropy = MAX_ANISO;
          tex.anisotropy = MAX_ANISO;
          return nrm;
        }
        return null;
      }

      const labelRenderer = new THREE.CSS2DRenderer();
      labelRenderer.setSize(window.innerWidth, window.innerHeight);
      labelRenderer.domElement.style.position = "absolute";
      labelRenderer.domElement.style.top = "0";
      labelRenderer.domElement.style.pointerEvents = "none";
      document
        .getElementById("canvasWrap")
        .appendChild(labelRenderer.domElement);

      // sky dome (gradient, khong can anh)
      (function buildSky() {
        const skyGeo = new THREE.SphereGeometry(140, 24, 16);
        const skyMat = new THREE.ShaderMaterial({
          uniforms: {
            topColor: { value: new THREE.Color(skyTop) },
            bottomColor: { value: new THREE.Color(skyBottom) },
            offset: { value: 18 },
            exponent: { value: 0.7 },
          },
          vertexShader: `varying vec3 vWorldPosition; void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vWorldPosition = wp.xyz; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
          fragmentShader: `uniform vec3 topColor; uniform vec3 bottomColor; uniform float offset; uniform float exponent; varying vec3 vWorldPosition;
      void main(){ float h = normalize(vWorldPosition + vec3(0.0, offset, 0.0)).y; gl_FragColor = vec4( mix(bottomColor, topColor, max(pow(max(h,0.0), exponent),0.0)), 1.0 ); }`,
          side: THREE.BackSide,
        });
        scene.add(new THREE.Mesh(skyGeo, skyMat));
      })();

      const sceneCenter = new THREE.Vector3(wx(800), 0, wz(800));
      // Truc mat troi: dinh huong lai theo yeu cau - phuong SONG SONG voi duong
      // thang noi 2 cong (MAP_GATE - SECONDARY_GATE, hai cong co cung y=1560 nen
      // duong noi la phuong ngang thuan tuy, khong lech), TINH TIEN phuong do di
      // qua dung khu bon nuoc (LAKE) o Khu Tam Linh. Ben "phai" (x lon hon, phia
      // Khu C) duoc quy uoc la huong DONG; mat troi dat o phia dong (x+) de anh
      // sang + bong do nhat quan voi quy uoc dong/tay/nam/bac cua khu dat.
      const sunAxisTarget = new THREE.Vector3(wx(LAKE.cx), 0, wz(LAKE.cy));

      const hemi = new THREE.HemisphereLight(0xffe6bd, 0x4a5a3a, 0.72);
      scene.add(hemi);
      const sun = new THREE.DirectionalLight(0xffcd8a, 1.5);
      sun.position.set(sunAxisTarget.x + 60, 34, sunAxisTarget.z);
      sun.target.position.copy(sunAxisTarget);
      sun.castShadow = true;
      sun.shadow.mapSize.set(1536, 1536);
      sun.shadow.camera.left = -30;
      sun.shadow.camera.right = 30;
      sun.shadow.camera.top = 30;
      sun.shadow.camera.bottom = -30;
      sun.shadow.camera.near = 1;
      sun.shadow.camera.far = 100;
      sun.shadow.bias = -0.0015;
      scene.add(sun, sun.target);
      const fill = new THREE.AmbientLight(0xfff2df, 0.22);
      scene.add(fill);

      // Vien nang nhe (rim light) - anh sang toc do thap, chieu gan nguoc voi
      // mat troi chinh, khong do bong (khong castShadow) nen re, chi tao vien
      // sang nhe o canh mo/cay quay ve huong do - tu nhien la "mot vai cai co,
      // khong phai cai nao cung co" vi phu thuoc huong quay cua tung vat the.
      const rimLight = new THREE.DirectionalLight(0xffe9b0, 0.55);
      rimLight.position.set(sunAxisTarget.x - 30, 10, sunAxisTarget.z);
      rimLight.target.position.copy(sunAxisTarget);
      scene.add(rimLight, rimLight.target);

      // sun glow sprite (duoc bloom lam sang len)
      const sunGlow = new THREE.Sprite(
        new THREE.SpriteMaterial({
          map: makeGlowTexture("rgba(255,250,225,1)", "rgba(255,250,225,0)"),
          transparent: true,
          depthWrite: false,
          depthTest: false,
          blending: THREE.AdditiveBlending,
        }),
      );
      sunGlow.scale.set(5.5, 5.5, 1);
      sunGlow.position.copy(sun.position);
      sunGlow.renderOrder = 999; // luon ve tren cung, khong bi tuong/cong/cay che (mat troi o rat xa, khong the bi vat the gan che that)
      scene.add(sunGlow);

      /* ------------------------------------------------------------------
       * HDRI THAT (do be gui) -> PMREM. 3 file .hdr da duoc minh xu ly san:
       * tai anh .exr 4K goc, gioi han highlight qua sang (clamp), giam con
       * 2048x1024 va nen lai dinh dang Radiance .hdr (~1.7MB/anh, hop web)
       * roi nen bang PMREMGenerator. Day la anh sang moi truong THAT (chup
       * tu ngoai doi), khong con la gradient gia lap nhu ban truoc.
       * Co the doi "khong khi" (nang som/chieu/vuon hoa) bang nut trong bang
       * dieu khien; moi luc doi se doi luon mau fog + huong nang cho khop.
       * ------------------------------------------------------------------ */
      const HDRI_PRESETS = {
        morning: {
          file: "assets/hdri/sky_charolettenbrunn_1k.hdr",
          fog: 0xdceaf5,
          sunColor: 0xfff6e0,
          sunPos: [46, 60, 0],
          exposure: 1.35,
          sunIntensity: 2.15,
          hemiIntensity: 0.95,
          fillIntensity: 0.32,
          label: "8h sang - nang ro",
        },
        rose: {
          file: "assets/hdri/sky_rose_garden_1k.hdr",
          fog: 0xf3e6c8,
          sunColor: 0xffdba0,
          sunPos: [58, 32, 0],
          exposure: 1.08,
          sunIntensity: 1.5,
          hemiIntensity: 0.72,
          fillIntensity: 0.22,
          label: "Nang som - vuon hoa",
        },
        driveway: {
          file: "assets/hdri/sky_driveway_1k.hdr",
          fog: 0xe9dcc0,
          sunColor: 0xffe6b8,
          sunPos: [54, 30, 0],
          exposure: 1.0,
          sunIntensity: 1.5,
          hemiIntensity: 0.72,
          fillIntensity: 0.22,
          label: "Dai lo hang cay",
        },
        park: {
          file: "assets/hdri/sky_charolettenbrunn_1k.hdr",
          fog: 0xdfe6da,
          sunColor: 0xfff2da,
          sunPos: [48, 36, 0],
          exposure: 0.98,
          sunIntensity: 1.5,
          hemiIntensity: 0.72,
          fillIntensity: 0.22,
          label: "Cong vien am u nhe",
        },
      };
      let currentHDRI = "morning";
      function applyEnvironment(key) {
        const preset = HDRI_PRESETS[key];
        if (!preset || typeof THREE.RGBELoader === "undefined") return;
        new THREE.RGBELoader().load(
          preset.file,
          (tex) => {
            tex.mapping = THREE.EquirectangularReflectionMapping;
            const pmrem = new THREE.PMREMGenerator(renderer);
            pmrem.compileEquirectangularShader();
            const envRT = pmrem.fromEquirectangular(tex);
            scene.environment = envRT.texture;
            tex.dispose();
            pmrem.dispose();
            scene.fog.color.setHex(preset.fog);
            sun.color.setHex(preset.sunColor);
            sun.position.set(
              sunAxisTarget.x + preset.sunPos[0],
              preset.sunPos[1],
              sunAxisTarget.z + preset.sunPos[2],
            );
            sun.target.position.copy(sunAxisTarget);
            sun.intensity = preset.sunIntensity || 1.5;
            hemi.intensity = preset.hemiIntensity || 0.72;
            fill.intensity = preset.fillIntensity || 0.22;
            sunGlow.position.copy(sun.position);
            renderer.toneMappingExposure = preset.exposure;
            currentHDRI = key;
          },
          undefined,
          (err) => {
            console.warn(
              "Khong tai duoc HDRI " + preset.file + ", dung ban giai lap.",
              err,
            );
            buildFallbackEnvironment();
          },
        );
      }
      // fallback: neu vi ly do gi khong tai duoc file .hdr that (thieu mang, sai
      // duong dan khi host web), dung lai gradient procedural nhu ban truoc de
      // scene khong bi mat anh sang moi truong hoan toan
      function buildFallbackEnvironment() {
        const c = document.createElement("canvas");
        c.width = 512;
        c.height = 256;
        const ctx = c.getContext("2d");
        const g = ctx.createLinearGradient(0, 0, 0, 256);
        g.addColorStop(0.0, "#bfe0f2");
        g.addColorStop(0.3, "#8fc3df");
        g.addColorStop(0.52, "#f7dfae");
        g.addColorStop(0.6, "#e7c98f");
        g.addColorStop(0.75, "#5c6a52");
        g.addColorStop(1.0, "#2c3527");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 512, 256);
        const sg = ctx.createRadialGradient(145, 77, 2, 145, 77, 70);
        sg.addColorStop(0, "rgba(255,247,225,1)");
        sg.addColorStop(0.15, "rgba(255,238,195,0.9)");
        sg.addColorStop(1, "rgba(255,238,195,0)");
        ctx.fillStyle = sg;
        ctx.fillRect(0, 0, 512, 256);
        const envTex = new THREE.CanvasTexture(c);
        envTex.mapping = THREE.EquirectangularReflectionMapping;
        envTex.encoding = THREE.sRGBEncoding;
        const pmrem = new THREE.PMREMGenerator(renderer);
        pmrem.compileEquirectangularShader();
        scene.environment = pmrem.fromEquirectangular(envTex).texture;
        pmrem.dispose();
      }
      if (typeof THREE.RGBELoader !== "undefined") {
        applyEnvironment(currentHDRI);
      } else {
        buildFallbackEnvironment();
      }
      const HDRI_ORDER = ["morning", "rose", "driveway", "park"];
      window.cycleEnvironment = function () {
        const idx = HDRI_ORDER.indexOf(currentHDRI);
        const next = HDRI_ORDER[(idx + 1) % HDRI_ORDER.length];
        applyEnvironment(next);
        const btn = document.getElementById("envBtn");
        if (btn) {
          btn.title = "Khong khi: " + HDRI_PRESETS[next].label;
        }
      };

      // ground
      // tai texture co that va NHUOM LAI mau ngay tren canvas: giam kenh do (bot vang),
      // tang nhe kenh xanh duong (them lanh) -> co trong tuoi, tong lanh thay vi vang/kho
      function loadRecoloredGrassTex(path, repeatX, repeatY) {
        const tex = new THREE.Texture();
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(repeatX, repeatY);
        tex.anisotropy = MAX_ANISO;
        tex.encoding = THREE.sRGBEncoding;
        const imgEl = new Image();
        imgEl.onload = function () {
          const c = document.createElement("canvas");
          c.width = imgEl.width;
          c.height = imgEl.height;
          const ctx = c.getContext("2d");
          ctx.drawImage(imgEl, 0, 0);
          const id = ctx.getImageData(0, 0, c.width, c.height);
          const d = id.data;
          for (let i = 0; i < d.length; i += 4) {
            const r = d[i],
              g = d[i + 1],
              b = d[i + 2];
            d[i] = r * 0.88; // bot vang nhe, khong bot qua tay
            d[i + 1] = g * 1.02; // giu / nhinh xanh la, tuoi hon
            d[i + 2] = Math.min(255, b * 1.18 + 4); // them chut xanh duong vua phai, khong lanh gat
          }
          ctx.putImageData(id, 0, 0);
          tex.image = c;
          tex.needsUpdate = true;
        };
        imgEl.src = path;
        return tex;
      }
      const grassTex = loadRecoloredGrassTex(
        "assets/textures/ground/grass_real.jpg",
        60,
        60,
      );
      const grassNormal = (function () {
        // ban do phap tuyen suy tu chinh anh co that (ham heightToNormalMap can
        // canvas da ve xong; voi anh tai bang TextureLoader ta doi callback load
        // xong roi moi tinh, tranh doc canvas rong)
        const holder = { tex: null };
        texLoader.load("assets/textures/ground/grass_real.jpg", (img) => {
          const c = document.createElement("canvas");
          c.width = img.image.width;
          c.height = img.image.height;
          c.getContext("2d").drawImage(img.image, 0, 0);
          const n = heightToNormalMap(c, 1.6);
          n.wrapS = n.wrapT = THREE.RepeatWrapping;
          n.repeat.set(60, 60);
          n.anisotropy = MAX_ANISO;
          holder.tex = n;
          if (groundMat) {
            groundMat.normalMap = n;
            groundMat.needsUpdate = true;
          }
          if (parkMat) {
            parkMat.normalMap = n;
            parkMat.needsUpdate = true;
          }
        });
        return holder;
      })();
      const stoneTex = makeStoneTexture();
      const forestFloorTex = makeForestFloorTexture();
      const shape = new THREE.Shape(
        BOUNDARY.map((p) => new THREE.Vector2(wx(p[0]), wz(p[1]))),
      );
      const groundGeo = new THREE.ShapeGeometry(shape);
      const groundMat = new THREE.MeshStandardMaterial({
        color: 0xb3e0ab,
        map: grassTex,
        normalMap: upgradeToPBR(grassTex, 50, 50, 2.2),
        normalScale: new THREE.Vector2(0.6, 0.6),
        roughness: 0.95,
      });
      const ground = new THREE.Mesh(groundGeo, groundMat);
      ground.rotation.x = -Math.PI / 2;
      ground.position.y = 0;
      ground.receiveShadow = true;
      scene.add(ground);

      // nen rung bao quanh - mo rong ra ngoai ranh gioi lo dat de cay vien co mat dat that
      const outerFloorGeo = new THREE.CircleGeometry(80, 48);
      const outerFloorMat = new THREE.MeshStandardMaterial({
        color: 0xb3e0ab,
        map: grassTex,
        roughness: 0.95,
      });
      const outerFloor = new THREE.Mesh(outerFloorGeo, outerFloorMat);
      outerFloor.rotation.x = -Math.PI / 2;
      outerFloor.position.set(sceneCenter.x, -0.01, sceneCenter.z);
      outerFloor.receiveShadow = true;
      scene.add(outerFloor);

      const boundaryPts = BOUNDARY.map(
        (p) => new THREE.Vector3(wx(p[0]), 0.03, wz(p[1])),
      );
      boundaryPts.push(boundaryPts[0].clone());
      const boundaryGeo = new THREE.BufferGeometry().setFromPoints(boundaryPts);
      const boundaryMat = new THREE.LineDashedMaterial({
        color: 0xb4552e,
        dashSize: 0.4,
        gapSize: 0.25,
        linewidth: 1,
      });
      const boundaryLine = new THREE.Line(boundaryGeo, boundaryMat);
      boundaryLine.computeLineDistances();
      scene.add(boundaryLine);

      // roads
      const roadMat = new THREE.MeshStandardMaterial({
        color: 0xdccdaa,
        map: stoneTex,
        normalMap: upgradeToPBR(stoneTex, 1, 1, 2.6),
        normalScale: new THREE.Vector2(0.7, 0.7),
        roughness: 0.95,
      });
      ROADS.forEach((r) => {
        const geo = new THREE.BoxGeometry(r.w * SC, 0.05, r.h * SC);
        const m = new THREE.Mesh(geo, roadMat);
        m.position.set(
          wx(r.x) + (r.w * SC) / 2,
          0.025,
          wz(r.y) + (r.h * SC) / 2,
        );
        m.receiveShadow = true;
        scene.add(m);
      });

      /* ------------------------------------------------------------------
       * Khu Tam Linh + Ho nuoc tuong niem (dung toa do that: tam 460,776 r58)
       * ------------------------------------------------------------------ */
      const parkMat = new THREE.MeshStandardMaterial({
        color: 0x74c17a,
        map: grassTex,
        roughness: 0.95,
      });
      const parkGeo = new THREE.BoxGeometry(
        SPIRIT_PARK.w * SC,
        0.06,
        SPIRIT_PARK.h * SC,
      );
      const parkMesh = new THREE.Mesh(parkGeo, parkMat);
      parkMesh.position.set(
        wx(SPIRIT_PARK.x) + (SPIRIT_PARK.w * SC) / 2,
        0.03,
        wz(SPIRIT_PARK.y) + (SPIRIT_PARK.h * SC) / 2,
      );
      parkMesh.receiveShadow = true;
      scene.add(parkMesh);

      /* --- Ho tuong niem duoc xay lai thanh mot BON HO HINH TRU that su (khong con la
       * hinh trang tri phang dan len mat dat nua): co thanh cong (curb) noi cao hon mat co,
       * mep tren PHANG - GOC CANH (khong bo tron kieu Torus nua), long ho khoet sau xuong
       * duoi mat dat mot chut, day ho co lat gach, va mat nuoc nam gan sat mep tren thanh
       * cong nen luon nhin "day nuoc", khong bi lap voi tham co dat / tia sang ep xuong. --- */
      const GROUND_Y = 0.06; // dung mat tren tham co lam moc chung
      const CURB_WALL_H = 0.16; // thanh cong nhoi cao hon mat co
      const BASIN_DEPTH = 0.04; // long ho khoet xuong duoi mat dat mot chut ("bi khoet trong")
      const CURB_THICK = 0.14; // do day thanh cong

      const lakeCenter = new THREE.Vector3(
        wx(LAKE.cx),
        GROUND_Y + CURB_WALL_H - 0.02,
        wz(LAKE.cy),
      ); // mat nuoc nam gan sat mep tren thanh cong
      const lakeRadius = LAKE.r * SC;

      const mosaicTex = makeMosaicTexture();
      const curbMat = new THREE.MeshStandardMaterial({
        color: 0x9fd0e0,
        map: mosaicTex,
        roughness: 0.45,
        metalness: 0.05,
      }); // thanh cong lat gach mosaic xanh
      // mep da tren cung: doi sang marble that (be gui - LatheColor tu bo fountain
      // simulation) thay vi mau phang, nhin nhu da hoa cuong that duoi nang
      const marbleRealTex = loadRepeatTex(
        "assets/textures/water/basin_marble.jpg",
        3,
        3,
        true,
      );
      const marbleRealNormal = (function () {
        const holder = { tex: null };
        texLoader.load("assets/textures/water/basin_marble.jpg", (img) => {
          const c = document.createElement("canvas");
          c.width = img.image.width;
          c.height = img.image.height;
          c.getContext("2d").drawImage(img.image, 0, 0);
          const n = heightToNormalMap(c, 1.4);
          n.wrapS = n.wrapT = THREE.RepeatWrapping;
          n.repeat.set(3, 3);
          n.anisotropy = MAX_ANISO;
          holder.tex = n;
          rimCapMat.normalMap = n;
          rimCapMat.needsUpdate = true;
        });
        return holder;
      })();
      const rimCapMat = new THREE.MeshStandardMaterial({
        color: 0xf3efe4,
        map: marbleRealTex,
        roughness: 0.38,
        envMapIntensity: 0.6,
      }); // mep da hoa cuong that, phang, goc canh ro
      const floorTex = makePoolFloorTexture();
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0xffffff,
        map: floorTex,
        roughness: 0.6,
      }); // day ho co lat gach

      const curbTopY = GROUND_Y + CURB_WALL_H;
      const basinFloorY = GROUND_Y - BASIN_DEPTH;

      // --- 1) Vach ngoai thanh cong (tu mat dat len den mep tren) - hinh tru dac, lat mosaic
      const curbOuterGeo = new THREE.CylinderGeometry(
        lakeRadius + CURB_THICK,
        lakeRadius + CURB_THICK,
        CURB_WALL_H,
        56,
        1,
        true,
      );
      const curbOuterMesh = new THREE.Mesh(curbOuterGeo, curbMat);
      curbOuterMesh.position.set(
        lakeCenter.x,
        GROUND_Y + CURB_WALL_H / 2,
        lakeCenter.z,
      );
      curbOuterMesh.castShadow = true;
      curbOuterMesh.receiveShadow = true;
      scene.add(curbOuterMesh);

      // --- 2) Mep tren thanh cong - mat PHANG hinh vanh khuyen, goc canh ro rang (thay Torus tron)
      const curbTopCapGeo = new THREE.RingGeometry(
        lakeRadius,
        lakeRadius + CURB_THICK,
        56,
        1,
      );
      const curbTopCapMesh = new THREE.Mesh(curbTopCapGeo, rimCapMat);
      curbTopCapMesh.rotation.x = -Math.PI / 2;
      curbTopCapMesh.position.set(lakeCenter.x, curbTopY, lakeCenter.z);
      curbTopCapMesh.receiveShadow = true;
      scene.add(curbTopCapMesh);

      // --- 3) Vach trong long ho (long ho khoet vao trong, tu mep tren xuong toi day ho) - lat mosaic
      const basinWallH = curbTopY - basinFloorY;
      const basinWallGeo = new THREE.CylinderGeometry(
        lakeRadius,
        lakeRadius,
        basinWallH,
        56,
        1,
        true,
      );
      const basinWallMesh = new THREE.Mesh(basinWallGeo, curbMat);
      basinWallMesh.position.set(
        lakeCenter.x,
        (curbTopY + basinFloorY) / 2,
        lakeCenter.z,
      );
      scene.add(basinWallMesh);

      // --- 4) Day ho - lat gach
      const floorGeo = new THREE.CircleGeometry(lakeRadius, 56);
      const floorMesh = new THREE.Mesh(floorGeo, floorMat);
      floorMesh.rotation.x = -Math.PI / 2;
      floorMesh.position.set(lakeCenter.x, basinFloorY, lakeCenter.z);
      floorMesh.receiveShadow = true;
      scene.add(floorMesh);

      const waterUniforms = {
        uTime: { value: 0 },
        uDeep: { value: new THREE.Color(0x1c7fa0) }, // xanh bien vua, sang hon ban cu (0c5064 qua toi/den)
        uShallow: { value: new THREE.Color(0x7fd4e8) }, // xanh bien nhat, sang de nhan ra la nuoc
        uSun: {
          value: new THREE.Vector3()
            .copy(sun.position)
            .sub(lakeCenter)
            .normalize(),
        },
      };
      const waterMat = new THREE.ShaderMaterial({
        uniforms: waterUniforms,
        transparent: true,
        vertexShader: `
    uniform float uTime;
    varying vec2 vXy;
    varying float vRipple;
    void main(){
      vXy = position.xy;
      float r = length(position.xy);
      float ripple = sin(r*7.0 - uTime*1.6) * 0.012 + sin(position.x*3.0+uTime*0.8)*0.006;
      vRipple = ripple;
      vec3 p = position + vec3(0.0,0.0, ripple);
      gl_Position = projectionMatrix * modelViewMatrix * vec4(p, 1.0);
    }`,
        fragmentShader: `
    uniform float uTime; uniform vec3 uDeep; uniform vec3 uShallow; uniform vec3 uSun;
    varying vec2 vXy; varying float vRipple;
    float hash(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    void main(){
      float r = length(vXy);
      float t = smoothstep(0.0, 1.0, r);
      vec3 base = mix(uDeep, uShallow, t*0.85 + vRipple*4.0);
      vec2 cell = floor(vXy*22.0 + uTime*0.15);
      float spark = hash(cell);
      float twinkle = step(0.986, spark) * (0.5 + 0.5*sin(uTime*6.0 + spark*40.0));
      vec3 col = base + vec3(twinkle*0.9);
      float edge = smoothstep(1.0, 0.88, r);
      float alpha = mix(0.8, 0.97, edge);
      gl_FragColor = vec4(col, alpha);
    }`,
      });
      const lakeGeo = new THREE.CircleGeometry(1, 64);
      const lakeMesh = new THREE.Mesh(lakeGeo, waterMat);
      lakeMesh.rotation.x = -Math.PI / 2; // nam phang xuong day ho (truoc day thieu dong nay nen mat nuoc dung thang, cat ngang thap)
      lakeMesh.scale.set(lakeRadius, lakeRadius, 1);
      lakeMesh.position.copy(lakeCenter);
      scene.add(lakeMesh);

      // nen gach mong lot duoi toan bo khu dai phun ("Khu tam linh") - tham chieu anh mau
      const plazaPaveTex = makeStoneTexture();
      // SUA LAI (LOI THAT SU): day truoc gio la 1 HINH TRON DAC (CircleGeometry) phu kin
      // tu tam ra ngoai, va no nam qua sat mat tham co (chi cao hon 0.006) -> bi z-fighting,
      // tham co de len che mat gach. Gio doi sang HINH VANH KHUYEN (co lo tron o giua, khong
      // dam vao thanh cong) VA nang cao han len (GROUND_Y+0.08) de khong con bi tham co lan at.
      const PLAZA_Y = GROUND_Y + 0.08;
      const plazaInnerR = lakeRadius + CURB_THICK + 0.05; // vua het thanh cong ngoai
      const plazaOuterRX = lakeRadius + 2.15; // chieu dai (doc theo khu dat) - giu nguyen nhu ban goc
      const plazaOuterRZ = Math.min(
        lakeRadius + 2.15,
        (SPIRIT_PARK.h * SC) / 2 - 0.03,
      ); // chieu hep - bi gioi han, tranh tran duong
      const plazaGeo = new THREE.RingGeometry(plazaInnerR, plazaOuterRZ, 64, 1);
      const plazaMat = new THREE.MeshStandardMaterial({
        color: 0xdcd6c0,
        map: plazaPaveTex,
        roughness: 0.88,
      });
      const plazaMesh = new THREE.Mesh(plazaGeo, plazaMat);
      plazaMesh.rotation.x = -Math.PI / 2;
      plazaMesh.scale.set(plazaOuterRX / plazaOuterRZ, 1, 1); // keo dai theo truc X de thanh hinh oval nhu ban goc
      plazaMesh.position.set(lakeCenter.x, PLAZA_Y, lakeCenter.z);
      plazaMesh.receiveShadow = true;
      scene.add(plazaMesh);

      /* --- Dai phun nuoc trung tam: thap da nhieu tang, nuoc tran xuong tung tang,
       * vong tia cong parabol toa ra vien ho (khong con la mang phang vuong vuc) --- */
      (function buildFountain() {
        const fountainGroup = new THREE.Group();
        const stoneLightMat = new THREE.MeshStandardMaterial({
          color: 0xece6d6,
          roughness: 0.5,
          metalness: 0.05,
        });
        const tierTops = [];
        let curY = lakeCenter.y + 0.02;
        function addTier(rTop, rBottom, height) {
          const g = new THREE.CylinderGeometry(rTop, rBottom, height, 28);
          const m = new THREE.Mesh(g, stoneLightMat);
          m.position.y = curY + height / 2;
          m.castShadow = true;
          m.receiveShadow = true;
          fountainGroup.add(m);
          curY += height;
          tierTops.push({ r: rTop, y: curY });
          return m;
        }
        addTier(lakeRadius * 0.5, lakeRadius * 0.56, 0.09);
        addTier(lakeRadius * 0.42, lakeRadius * 0.47, 0.045);
        addTier(lakeRadius * 0.26, lakeRadius * 0.3, 0.11);
        addTier(lakeRadius * 0.19, lakeRadius * 0.23, 0.04);
        addTier(lakeRadius * 0.1, lakeRadius * 0.14, 0.14);
        const cap = new THREE.Mesh(
          new THREE.SphereGeometry(lakeRadius * 0.06, 12, 10),
          stoneLightMat,
        );
        cap.position.y = curY + lakeRadius * 0.03;
        cap.castShadow = true;
        fountainGroup.add(cap);
        const spoutTopY = cap.position.y + lakeRadius * 0.05;
        fountainGroup.position.set(lakeCenter.x, 0, lakeCenter.z);
        scene.add(fountainGroup);

        // man nuoc mong phu tren mep tung tang, mo phong nuoc tran chay xuong thap da
        // dung anh nuoc chay THAT (be gui - "0028-falling-water") thay vi noise ve tay,
        // nhin co dong nuoc/tia nuoc that thay vi cham xam mo
        const veilTex = loadRepeatTex(
          "assets/textures/water/water_curtain.jpg",
          2,
          1,
          true,
        );
        veilTex.wrapT = THREE.ClampToEdgeWrapping;
        // giam opacity + doi mau nhat hon (bot trang) de khong lan at mau xanh nuoc ben duoi khi cong bloom
        const veilBaseMat = new THREE.MeshBasicMaterial({
          map: veilTex,
          color: 0xdcf1f7,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        window.__fountainVeils = [];
        tierTops.slice(0, -1).forEach((tp) => {
          const vg = new THREE.CylinderGeometry(
            tp.r * 1.03,
            tp.r * 1.12,
            0.16,
            24,
            1,
            true,
          );
          const vm = new THREE.Mesh(vg, veilBaseMat.clone());
          vm.position.set(lakeCenter.x, tp.y - 0.06, lakeCenter.z);
          scene.add(vm);
          window.__fountainVeils.push({
            mesh: vm,
            phase: Math.random() * Math.PI * 2,
          });
        });

        // tia phun trung tam dang non thon tron (khong con la tam phang vuong vuc)
        const jetMat = new THREE.MeshBasicMaterial({
          color: 0xcdeaf5,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const centerJet = new THREE.Mesh(
          new THREE.CylinderGeometry(
            0.012,
            lakeRadius * 0.09,
            lakeRadius * 0.8,
            12,
            6,
            true,
          ),
          jetMat.clone(),
        );
        centerJet.position.set(
          lakeCenter.x,
          spoutTopY + lakeRadius * 0.4,
          lakeCenter.z,
        );
        scene.add(centerJet);
        window.__centerJet = { mesh: centerJet, baseY: centerJet.position.y };

        // vong tia cong hinh parabol, toa tu chan thap ra vien ho (Tube theo duong cong bezier -
        // dung y "cong parabol" thay vi duong thang, giai quyet cam giac vuong vuc truoc do)
        const arcMat = new THREE.MeshBasicMaterial({
          color: 0xcdeaf5,
          transparent: true,
          opacity: 0.42,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          side: THREE.DoubleSide,
        });
        window.__waterArcs = [];
        const arcCount = 18;
        const innerR = lakeRadius * 0.3,
          outerR = lakeRadius * 0.86,
          peakY = lakeRadius * 0.6;
        for (let i = 0; i < arcCount; i++) {
          const ang = (i / arcCount) * Math.PI * 2;
          const ix = lakeCenter.x + Math.cos(ang) * innerR,
            iz = lakeCenter.z + Math.sin(ang) * innerR;
          const ox = lakeCenter.x + Math.cos(ang) * outerR,
            oz = lakeCenter.z + Math.sin(ang) * outerR;
          const mx = lakeCenter.x + Math.cos(ang) * (innerR + outerR) * 0.42,
            mz = lakeCenter.z + Math.sin(ang) * (innerR + outerR) * 0.42;
          const curve = new THREE.QuadraticBezierCurve3(
            new THREE.Vector3(ix, lakeCenter.y + 0.22, iz),
            new THREE.Vector3(mx, lakeCenter.y + peakY, mz),
            new THREE.Vector3(ox, lakeCenter.y + 0.03, oz),
          );
          const tubeGeo = new THREE.TubeGeometry(curve, 18, 0.016, 6, false);
          const m = new THREE.Mesh(tubeGeo, arcMat.clone());
          scene.add(m);
          window.__waterArcs.push({
            mesh: m,
            phase: Math.random() * Math.PI * 2,
          });
        }

        // vong tia nho quanh mep, dang non tron (thay cho 3 mang phang cheo nhau truoc day)
        const smallJetMat = new THREE.MeshBasicMaterial({
          color: 0xcdeaf5,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        window.__smallJets = [];
        const smallJetCount = 8;
        for (let i = 0; i < smallJetCount; i++) {
          const ang = (i / smallJetCount) * Math.PI * 2 + 0.2;
          const jx = lakeCenter.x + Math.cos(ang) * lakeRadius * 0.84;
          const jz = lakeCenter.z + Math.sin(ang) * lakeRadius * 0.84;
          const g = new THREE.CylinderGeometry(
            0.006,
            lakeRadius * 0.032,
            lakeRadius * 0.24,
            8,
            4,
            true,
          );
          const m = new THREE.Mesh(g, smallJetMat.clone());
          m.position.set(jx, lakeCenter.y + 0.02 + lakeRadius * 0.12, jz);
          scene.add(m);
          window.__smallJets.push({
            mesh: m,
            baseY: m.position.y,
            phase: Math.random() * Math.PI * 2,
          });
        }

        // bot nuoc dang tron (thay cho tam phang vuong truoc day) quanh chan thap
        // dung anh bot sang THAT (be gui - "cc.jpeg", mot glow tron mem) thay vi
        // texture bot ve tay bang canvas
        const foamMat = new THREE.MeshBasicMaterial({
          map: loadRepeatTex("assets/textures/water/foam_glow.jpg", 1, 1, true),
          color: 0xdcf1f7,
          transparent: true,
          opacity: 0.4,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
        });
        const foamGeo = new THREE.CircleGeometry(lakeRadius * 0.4, 28);
        const foam = new THREE.Mesh(foamGeo, foamMat);
        foam.rotation.x = -Math.PI / 2;
        foam.position.set(lakeCenter.x, lakeCenter.y + 0.03, lakeCenter.z);
        scene.add(foam);
        window.__fountainFoam = foam;
      })();

      /* --- 4 bon co/hoa vien cong quanh dai phun, dung nen gach mong o duoi (tham chieu anh mau) --- */
      (function buildFountainBeds() {
        const bedInnerR = lakeRadius + 0.65,
          bedOuterR = lakeRadius + 1.55;
        const arcSpan = Math.PI * 0.34;
        const borderMat = new THREE.MeshStandardMaterial({
          color: 0x2b2f26,
          roughness: 0.85,
        });
        const grassMat = new THREE.MeshStandardMaterial({
          color: 0x4f9a4f,
          map: makeGrassTexture(),
          roughness: 0.9,
        });
        const ballGeo = new THREE.SphereGeometry(0.17, 10, 8);
        const ballMat = new THREE.MeshStandardMaterial({
          color: 0x3f7a44,
          roughness: 0.85,
        });
        const potGeo = new THREE.CylinderGeometry(0.1, 0.12, 0.08, 8);
        const potMat = new THREE.MeshStandardMaterial({
          color: 0x8a8378,
          roughness: 0.8,
        });
        [0, Math.PI / 2, Math.PI, Math.PI * 1.5].forEach((baseAng, gi) => {
          const start = baseAng - arcSpan / 2;
          const border = new THREE.Mesh(
            new THREE.RingGeometry(
              bedInnerR - 0.07,
              bedOuterR + 0.07,
              32,
              1,
              start,
              arcSpan,
            ),
            borderMat,
          );
          border.rotation.x = -Math.PI / 2;
          border.position.set(lakeCenter.x, 0.012, lakeCenter.z);
          border.receiveShadow = true;
          scene.add(border);
          const grass = new THREE.Mesh(
            new THREE.RingGeometry(bedInnerR, bedOuterR, 32, 1, start, arcSpan),
            grassMat,
          );
          grass.rotation.x = -Math.PI / 2;
          grass.position.set(lakeCenter.x, 0.018, lakeCenter.z);
          grass.receiveShadow = true;
          scene.add(grass);
          // bui canh tron o hai dau bon + cay nho o giua
          [start + 0.05, start + arcSpan - 0.05].forEach((a) => {
            const bx =
                lakeCenter.x + (Math.cos(a) * (bedInnerR + bedOuterR)) / 2,
              bz = lakeCenter.z + (Math.sin(a) * (bedInnerR + bedOuterR)) / 2;
            const pot = new THREE.Mesh(potGeo, potMat);
            pot.position.set(bx, 0.05, bz);
            pot.receiveShadow = true;
            const ball = new THREE.Mesh(ballGeo, ballMat);
            ball.position.set(bx, 0.26, bz);
            ball.castShadow = true;
            scene.add(pot, ball);
          });
          const midA = baseAng;
          const midX =
              lakeCenter.x + (Math.cos(midA) * (bedInnerR + bedOuterR)) / 2,
            midZ =
              lakeCenter.z + (Math.sin(midA) * (bedInnerR + bedOuterR)) / 2;
          const midBush = new THREE.Mesh(
            new THREE.SphereGeometry(0.22, 10, 8),
            ballMat,
          );
          midBush.position.set(midX, 0.2, midZ);
          midBush.scale.set(1, 1.15, 1);
          midBush.castShadow = true;
          scene.add(midBush);
        });
      })();

      /* ------------------------------------------------------------------
       * Cay xanh (rung da dang, cao thap khac nhau, lay lung gio) + Da lung linh
       * ------------------------------------------------------------------ */
      /* ------------------------------------------------------------------
       * Bong tiep xuc (contact shadow) gia lap: mot dia gradient mo duoi
       * chan cay / tru da de vat khong bi "lo lung" tren mat dat khi nhin gan
       * (thay the mot phan cho GTAO/contact shadow that vi WebGL thuan khong
       * co AO theo khong gian man hinh full nhu game engine).
       * ------------------------------------------------------------------ */
      const contactShadowTex = (function () {
        const c = document.createElement("canvas");
        c.width = c.height = 128;
        const ctx = c.getContext("2d");
        const g = ctx.createRadialGradient(64, 64, 4, 64, 64, 62);
        g.addColorStop(0, "rgba(0,0,0,0.55)");
        g.addColorStop(0.6, "rgba(0,0,0,0.28)");
        g.addColorStop(1, "rgba(0,0,0,0)");
        ctx.fillStyle = g;
        ctx.fillRect(0, 0, 128, 128);
        return new THREE.CanvasTexture(c);
      })();
      const contactShadowGeo = new THREE.PlaneGeometry(1, 1);
      contactShadowGeo.rotateX(-Math.PI / 2);
      // Toi uu hieu nang: thay vi tao 1 Mesh + 1 Material rieng cho MOI cay
      // (hang nghin draw call), gom tat ca bong tiep xuc vao 1 InstancedMesh
      // duy nhat (dung chung 1 material, opacity trung binh). Cac vi tri duoc
      // gom lai truoc, dung InstancedMesh xay 1 lan duy nhat o cuoi (xem
      // finalizeContactShadows() goi truoc animate()).
      const contactShadowMat = new THREE.MeshBasicMaterial({
        map: contactShadowTex,
        transparent: true,
        opacity: 0.4,
        depthWrite: false,
        polygonOffset: true,
        polygonOffsetFactor: -1,
      });
      const pendingContactShadows = [];
      function addContactShadow(x, z, radius, opacity) {
        pendingContactShadows.push({ x, z, radius });
      }
      function finalizeContactShadows() {
        if (!pendingContactShadows.length) return;
        const inst = new THREE.InstancedMesh(
          contactShadowGeo,
          contactShadowMat,
          pendingContactShadows.length,
        );
        const dummy = new THREE.Object3D();
        pendingContactShadows.forEach((s, i) => {
          dummy.position.set(s.x, 0.006, s.z);
          dummy.scale.set(s.radius * 2, 1, s.radius * 2);
          dummy.rotation.set(0, 0, 0);
          dummy.updateMatrix();
          inst.setMatrixAt(i, dummy.matrix);
        });
        inst.instanceMatrix.needsUpdate = true;
        inst.renderOrder = 1;
        inst.frustumCulled = false;
        scene.add(inst);
        pendingContactShadows.length = 0;
      }

      const trunkMat = new THREE.MeshStandardMaterial({
        color: 0x5b3d24,
        roughness: 0.95,
      });

      /* ------------------------------------------------------------------
       * CAY THAT (tu texture be gui - tree_small_02, chi lay chat lieu vi
       * khong mo duoc file .blend goc trong sandbox). Ky thuat "leaf card":
       * than cay dung anh vo cay that (bark), tan la dung 2 loai the la that
       * cat tu texture atlas Poly Haven - "sprig" (nhanh la ro net, dung gan
       * truc than) va "blob" (mang tan la mo, dung lam khoi tan day xung
       * quanh cho khoi bi lo lo). Day la ky thuat dung pho bien trong game
       * AAA (vd Genshin, TLOU) de tao cay that ma khong can hang trieu polygon.
       * ------------------------------------------------------------------ */
      const realBarkAlbedo = loadRepeatTex(
        "assets/textures/tree/bark_diff.jpg",
        1,
        3,
        true,
      );
      const realBarkNormal = loadRepeatTex(

        3,
        false,
      );
      const realBarkRough = loadRepeatTex(
        "assets/textures/tree/bark_rough.jpg",

        3,

      );
      const realBarkMat = new THREE.MeshStandardMaterial({
        map: realBarkAlbedo,
        normalMap: realBarkNormal,
        roughnessMap: realBarkRough,
        roughness: 1,
        envMapIntensity: 0.25,
      });

      const realSprigTex = loadRepeatTex(
        "assets/textures/tree/leaf_sprig.png",
        1,
        1,
        true,
      );
      const realSprigNorm = loadRepeatTex(
        "assets/textures/tree/leaf_sprig_normal.jpg",
        1,
        1,
        false,
      );
      const realSprigRough = loadRepeatTex(
        "assets/textures/tree/leaf_sprig_rough.jpg",
        1,
        1,
        false,
      );
      const realBlobTex = loadRepeatTex(
        "assets/textures/tree/leaf_canopy_blob.png",
        1,
        1,
        true,
      );
      const realBlobNorm = loadRepeatTex(
        "assets/textures/tree/leaf_blob_normal.jpg",

      const realBlobRough = loadRepeatTex(
        "assets/textures/tree/leaf_blob_rough.jpg",
        1,

      );
      const realSprigMat = new THREE.MeshStandardMaterial({
        map: realSprigTex,
        normalMap: realSprigNorm,
        roughnessMap: realSprigRough,
        roughness: 1,
        transparent: true,
        alphaTest: 0.35,
        side: THREE.DoubleSide,
        envMapIntensity: 0.3,
      });
      const realBlobMat = new THREE.MeshStandardMaterial({
        map: realBlobTex,
        normalMap: realBlobNorm,
        roughnessMap: realBlobRough,
