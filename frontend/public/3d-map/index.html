        cells.forEach((c) => allCells.push({ key, ...c }));
      });

      const starMesh = new THREE.InstancedMesh(starGeo, starMat, totalCells);
      starMesh.castShadow = true;
      const photoMesh = new THREE.InstancedMesh(photoGeo, photoMat, totalCells);
      const dummy = new THREE.Object3D();

      function placeDummy(c) {
        const cx = wx(c.cx + c.cw / 2),
          cz = wz(c.cy + c.ch / 2);
        const sx = Math.max(c.cw * SC * 0.82, 0.15),
          sz = Math.max(c.ch * SC * 0.82, 0.15);
        dummy.position.set(cx, PLATFORM_H, cz);
        dummy.scale.set(sx, 1, sz);
        dummy.rotation.set(0, 0, 0);
        dummy.updateMatrix();
      }

      // Gom mo theo TUNG material rieng (gio co 4 loai: vang, do gach, xam trang,
      // xam trung tinh) - dung generic thay vi code cung 2 loai nhu truoc, de de
      // mo rong/doi mau tung khu sau nay ma khong phai sua lai cau truc.
      const TOMB_MAT_LIST = [
        tombMatGold,
        tombMatBrickRed,
        tombMatYellow,
        tombMatGray,
      ];
      const tombMeshesByMat = TOMB_MAT_LIST.map((mat) => {
        const cells = allCells.filter((c) => ZONE_TOMB_MAT[c.key] === mat);
        const mesh = new THREE.InstancedMesh(
          tombGeo,
          mat,
          Math.max(cells.length, 1),
        );
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        cells.forEach((c, i) => {
          placeDummy(c);
          mesh.setMatrixAt(i, dummy.matrix);
        });
        mesh.count = cells.length;
        mesh.instanceMatrix.needsUpdate = true;
        return mesh;
      });
      allCells.forEach((c, i) => {
        placeDummy(c);
        starMesh.setMatrixAt(i, dummy.matrix);
        photoMesh.setMatrixAt(i, dummy.matrix);
      });
      starMesh.instanceMatrix.needsUpdate = true;
      photoMesh.instanceMatrix.needsUpdate = true;
      scene.add(...tombMeshesByMat, starMesh, photoMesh);

      /* ------------------------------------------------------------------
       * Khu C - Lo gia toc: moi cum (C1-C4) la mot khu lang mo gia toc rieng
       * gom cong/dai tho nhieu tang o phia sau, dinh huong o giua, khoang
       * ~10 mo gia toc lon hai ben loi di, hang rao da va hoa doc loi di,
       * tham chieu bo cuc anh mau 2.
       * ------------------------------------------------------------------ */
      const familyStoneTex = graniteRealAlbedo;
      const GRANITE_WHITE_GRAY = 0xc4c2b8; // trang xam da hoa cuong SANG, trung tinh am - khu C, dong bo voi ghe da (gardenStoneMat)
      // mo trang da cam thach (marble) sang hon, giong anh mau tham khao (mo trang
      // don gian, khong choi, gan nhu trang nga) - giam do anh huong cua map/normal
      // granite de be mat min hon, giong da hoa cuong trang thay vi granite tham
      const FAMILY_MARBLE_WHITE = 0xe9e6da;
      const familyBodyMat = new THREE.MeshStandardMaterial({
        color: FAMILY_MARBLE_WHITE,
        map: familyStoneTex,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.32, 0.32),
        roughnessMap: graniteRealRough,
        roughness: 0.5,
        metalnessMap: graniteRealMetal,
        metalness: 0.04,
        envMapIntensity: 0.95,
      }); // trang da cam thach sang, min hon
      const familyTrimMat = new THREE.MeshStandardMaterial({
        color: 0x22302a,
        roughness: 0.6,
      });
      const familyAltarMat = new THREE.MeshStandardMaterial({
        color: 0xd6d4c8,
        map: familyStoneTex,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.6, 0.6),
        roughnessMap: graniteRealRough,
        roughness: 0.72,
        envMapIntensity: 0.7,
      });
      const familyRoofMat = new THREE.MeshStandardMaterial({
        color: 0x263028,
        roughness: 0.55,
      });
      const familyGoldMat = new THREE.MeshStandardMaterial({
        color: 0xc9a227,
        roughness: 0.25,
        metalness: 0.75,
        envMapIntensity: 1.3,
      });
      const familyPathMat = new THREE.MeshStandardMaterial({
        color: 0xd7d0be,
        map: stoneTex,
        roughness: 0.9,
      });
      const familyFlowerMat = new THREE.MeshStandardMaterial({
        color: 0xc23b3b,
        roughness: 0.6,
      });
      const familyLeafMat = new THREE.MeshStandardMaterial({
        color: 0x2f5a37,
        roughness: 0.8,
      });

      function familyGroupRects(layout) {
        const g = layout.groups;
        const gw = (layout.w - g.gap * (g.cols - 1)) / g.cols;
        const gh = (layout.h - g.gap * (g.rows - 1)) / g.rows;
        const out = [];
        for (let gr = 0; gr < g.rows; gr++) {
          for (let gc = 0; gc < g.cols; gc++) {
            out.push({
              x: layout.x + gc * (gw + g.gap),
              y: layout.y + gr * (gh + g.gap),
              w: gw,
              h: gh,
            });
          }
        }
        return out;
      }

      // mo da cam thach trang, khoi vuong vuc thap, bia phang gan lien tren mat
      // (khong dung bia dung dung rieng) - tham chieu bo cuc anh mau: khoi da
      // hinh hop thon dan 3 cap, mat tren co tam bia nho phang va vong tron
      // vang nho o giua, dang mo pho bien trong nghia trang da hoa cuong.
      const famTombBase = new THREE.BoxGeometry(1.08, 0.22, 1.62);
      famTombBase.translate(0, 0.11, 0);
      const famTombMid = new THREE.BoxGeometry(0.9, 0.14, 1.38);
      famTombMid.translate(0, 0.22 + 0.07, 0.02);
      const famTombTop = new THREE.BoxGeometry(0.72, 0.08, 1.02);
      famTombTop.translate(0, 0.22 + 0.14 + 0.04, 0.05);
      const famPlaque = new THREE.BoxGeometry(0.42, 0.018, 0.28);
      famPlaque.translate(0, 0.22 + 0.14 + 0.08 + 0.01, -0.26);
      const familyTombGeo = THREE.BufferGeometryUtils.mergeBufferGeometries([
        famTombBase,
        famTombMid,
        famTombTop,
        famPlaque,
      ]);
      const famEmblemGeo = new THREE.TorusGeometry(0.075, 0.013, 8, 20);
      famEmblemGeo.rotateX(Math.PI / 2);
      famEmblemGeo.translate(0, 0.22 + 0.14 + 0.08 + 0.021, -0.26);

      function buildFamilyTomb(px, pz, rotY, scale) {
        const g = new THREE.Group();
        const body = new THREE.Mesh(familyTombGeo, familyBodyMat);
        body.castShadow = true;
        body.receiveShadow = true;
        const emblem = new THREE.Mesh(famEmblemGeo, familyGoldMat);
        emblem.castShadow = true;
        g.add(body, emblem);
        g.position.set(px, 0, pz);
        g.rotation.y = rotY || 0;
        g.scale.setScalar(scale || 1);
        scene.add(g);
      }

      // cong / dai tho nhieu tang phia sau cum (mo phong kien truc anh mau 2)
      function buildFamilyAltar(px, pz, rotY, scale) {
        const g = new THREE.Group();
        const tier = (w, h, d, y, mat) => {
          const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat);
          m.position.y = y;
          m.castShadow = true;
          m.receiveShadow = true;
          g.add(m);
          return m;
        };
        // canh 2 ben (tuong thap co hoa van khung)
        tier(1.6, 0.7, 0.22, 0.35, familyAltarMat).position.x = -1.15;
        tier(1.6, 0.7, 0.22, 0.35, familyAltarMat).position.x = 1.15;
        tier(0.28, 0.9, 0.22, 0.45, familyAltarMat).position.x = -1.95;
        tier(0.28, 0.9, 0.22, 0.45, familyAltarMat).position.x = 1.95;
        // than chinh 3 tang thu nho dan, moi tang co mai vuon xa hai ben
        tier(1.0, 0.75, 0.7, 0.375, familyAltarMat);
        tier(1.18, 0.06, 0.86, 0.78, familyRoofMat);
        tier(0.74, 0.55, 0.5, 1.08, familyAltarMat);
        tier(0.9, 0.05, 0.64, 1.38, familyRoofMat);
        tier(0.5, 0.4, 0.34, 1.62, familyAltarMat);
        tier(0.64, 0.05, 0.46, 1.85, familyRoofMat);
        const finial = new THREE.Mesh(
          new THREE.ConeGeometry(0.12, 0.28, 8),
          familyGoldMat,
        );
        finial.position.y = 2.02;
        finial.castShadow = true;
        g.add(finial);
        // cua vom nho tren than chinh
        const door = new THREE.Mesh(
          new THREE.BoxGeometry(0.34, 0.5, 0.02),
          familyRoofMat,
        );
        door.position.set(0, 0.28, 0.36);
        g.add(door);
        g.position.set(px, 0, pz);
        g.rotation.y = rotY || 0;
        g.scale.setScalar(scale || 1);
        scene.add(g);
      }

      // dinh huong dat truoc dai tho
      function buildIncenseBurner(px, pz, scale) {
        const g = new THREE.Group();
        const base = new THREE.Mesh(
          new THREE.CylinderGeometry(0.14, 0.18, 0.1, 16),
          familyGoldMat,
        );
        base.position.y = 0.05;
        g.add(base);
        const body = new THREE.Mesh(
          new THREE.SphereGeometry(
            0.16,
            16,
            12,
            0,
            Math.PI * 2,
            0,
            Math.PI * 0.62,
          ),
          familyGoldMat,
        );
        body.position.y = 0.16;
        g.add(body);
        const rim = new THREE.Mesh(
          new THREE.TorusGeometry(0.17, 0.018, 8, 20),
          familyGoldMat,
        );
        rim.position.y = 0.25;
        rim.rotation.x = Math.PI / 2;
        g.add(rim);
        const lid = new THREE.Mesh(
          new THREE.ConeGeometry(0.09, 0.16, 12),
          familyGoldMat,
        );
        lid.position.y = 0.36;
        g.add(lid);
        g.traverse((o) => {
          if (o.isMesh) {
            o.castShadow = true;
          }
        });
        g.position.set(px, 0, pz);
        g.scale.setScalar(scale || 1);
        scene.add(g);
      }

      // hang rao da quanh cum (chi con tru da, da bo thanh sat ngang lien ket theo yeu cau)
      function buildFamilyFence(rectW, rectH) {
        const postGeo = new THREE.CylinderGeometry(0.035, 0.04, 0.42, 8);
        const hw = rectW / 2,
          hh = rectH / 2;
        const spacing = 0.9;
        const edges = [
          { from: [-hw, -hh], to: [hw, -hh] },
          { from: [-hw, hh], to: [hw, hh] },
          { from: [-hw, -hh], to: [-hw, hh] },
          { from: [hw, -hh], to: [hw, hh] },
        ];
        const parts = [];
        edges.forEach((e) => {
          const dx = e.to[0] - e.from[0],
            dz = e.to[1] - e.from[1];
          const len = Math.hypot(dx, dz);
          const n = Math.max(2, Math.round(len / spacing));
          for (let i = 0; i <= n; i++) {
            const t = i / n;
            const x = e.from[0] + dx * t,
              z = e.from[1] + dz * t;
            // bo qua cac tru trung tam canh truoc (chua loi di)
            if (Math.abs(z - hh) < 0.01 && Math.abs(x) < 0.7) continue;
            const p = postGeo.clone();
            p.translate(x, 0.21, z);
            parts.push(p);
          }
        });
        const merged = THREE.BufferGeometryUtils.mergeBufferGeometries(parts);
        const mesh = new THREE.Mesh(merged, familyTrimMat);
        mesh.castShadow = true;
        mesh.receiveShadow = true;
        return mesh;
      }

      // binh hoa doc theo path (chau da + cum hoa do + la xanh), dat hai ben loi di
      const vasePotGeo = new THREE.CylinderGeometry(0.09, 0.13, 0.22, 10);
      vasePotGeo.translate(0, 0.11, 0);
      const vaseRimGeo = new THREE.TorusGeometry(0.095, 0.014, 6, 12);
      vaseRimGeo.translate(0, 0.22, 0);
      const vaseFoliageGeo = new THREE.SphereGeometry(0.16, 8, 6);
      vaseFoliageGeo.translate(0, 0.34, 0);
      const vasePotMat = new THREE.MeshStandardMaterial({
        color: 0xcdb693,
        roughness: 0.8,
      });
      const vaseFoliageMat = new THREE.MeshStandardMaterial({
        color: 0x3f6f47,
        roughness: 0.85,
      });
      const vaseFlowerGeo = new THREE.SphereGeometry(0.045, 6, 5);

      function buildFlowerVase(px, pz, scale) {
        const g = new THREE.Group();
        const pot = new THREE.Mesh(vasePotGeo, vasePotMat);
        pot.castShadow = true;
        pot.receiveShadow = true;
        const rim = new THREE.Mesh(vaseRimGeo, vasePotMat);
        rim.rotation.x = Math.PI / 2;
        const foliage = new THREE.Mesh(vaseFoliageGeo, vaseFoliageMat);
        foliage.castShadow = true;
        g.add(pot, rim, foliage);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const fl = new THREE.Mesh(vaseFlowerGeo, familyFlowerMat);
          fl.position.set(
            Math.cos(a) * 0.13,
            0.36 + Math.sin(i) * 0.03,
            Math.sin(a) * 0.13,
          );
          fl.castShadow = true;
          g.add(fl);
        }
        g.position.set(px, 0, pz);
        g.scale.setScalar(scale || 1);
        scene.add(g);
      }

      /* ------------------------------------------------------------------
       * Dai hoa sen (lotus altar) - dat giua cac cum nho C1-C4 cua Khu C,
       * tham chieu anh mau nguoi dung gui: binh phong da hinh quat cham
       * hoa van cuon thu 2 ben, phu dieu chu tron mau giua, be tron phia
       * truoc co hoa sen no.
       * ------------------------------------------------------------------ */
      const lotusPetalMat = new THREE.MeshStandardMaterial({
        color: 0xe888b0,
        roughness: 0.5,
      });
      const lotusCenterMat = new THREE.MeshStandardMaterial({
        color: 0xf2c94c,
        roughness: 0.45,
        metalness: 0.15,
      });
      const lotusLeafMat = new THREE.MeshStandardMaterial({
        color: 0x3c7a4a,
        roughness: 0.75,
      });
      const lotusStemMat = new THREE.MeshStandardMaterial({
        color: 0x4f8a5c,
        roughness: 0.8,
      });
      const lotusBasinMat = new THREE.MeshStandardMaterial({
        color: 0xd9d6c8,
        map: familyStoneTex,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.4, 0.4),
        roughnessMap: graniteRealRough,
        roughness: 0.6,
        metalnessMap: graniteRealMetal,
        metalness: 0.05,
        envMapIntensity: 0.9,
      });
      const lotusWaterMat = new THREE.MeshStandardMaterial({
        color: 0x9fc2b0,
        roughness: 0.25,
        metalness: 0.1,
        transparent: true,
        opacity: 0.85,
      });
      const lotusScreenMat = familyAltarMat;

      function buildLotusFlower(px, py, pz, scale) {
        const g = new THREE.Group();
        const stem = new THREE.Mesh(
          new THREE.CylinderGeometry(0.01, 0.014, 0.16, 6),
          lotusStemMat,
        );
        stem.position.y = 0.08;
        g.add(stem);
        for (let i = 0; i < 6; i++) {
          const a = (i / 6) * Math.PI * 2;
          const petal = new THREE.Mesh(
            new THREE.SphereGeometry(0.045, 8, 6),
            lotusPetalMat,
          );
          petal.scale.set(0.55, 1, 0.32);
          petal.position.set(Math.cos(a) * 0.032, 0.16, Math.sin(a) * 0.032);
          petal.rotation.y = a;
          petal.rotation.x = -0.5;
          g.add(petal);
        }
        const center = new THREE.Mesh(
          new THREE.SphereGeometry(0.022, 8, 6),
          lotusCenterMat,
        );
        center.position.y = 0.185;
        g.add(center);
        g.traverse((o) => {
          if (o.isMesh) o.castShadow = true;
        });
        g.position.set(px, py, pz);
        g.scale.setScalar(scale || 1);
        return g;
      }
      function buildLotusPad(px, py, pz, scale) {
        const pad = new THREE.Mesh(
          new THREE.CircleGeometry(0.11, 10),
          lotusLeafMat,
        );
        pad.rotation.x = -Math.PI / 2;
        pad.position.set(px, py, pz);
        pad.scale.setScalar(scale || 1);
        pad.receiveShadow = true;
        return pad;
      }

      function buildLotusAltar(px, pz, rotY, scale) {
        const g = new THREE.Group();

        // de tang duoi binh phong
        const pedestal = new THREE.Mesh(
          new THREE.BoxGeometry(1.0, 0.22, 0.2),
          lotusScreenMat,
        );
        pedestal.position.set(0, 0.11, -0.32);
        pedestal.castShadow = true;
        pedestal.receiveShadow = true;
        g.add(pedestal);

        // binh phong da hinh quat/vom cong, tham chieu bo cuc anh mau (khoi cong
        // uon tu de len, cham hoa van bang texture da that)
        const screenGeo = new THREE.CylinderGeometry(
          0.66,
          0.66,
          0.1,
          28,
          1,
          false,
          0,
          Math.PI,
        );
        screenGeo.rotateZ(Math.PI / 2);
        screenGeo.rotateY(Math.PI / 2);
        screenGeo.translate(0, 0.2, -0.35);
        const screen = new THREE.Mesh(screenGeo, lotusScreenMat);
        screen.castShadow = true;
        screen.receiveShadow = true;
        g.add(screen);

        // phu dieu tron mau giua binh phong (thay cho chu Tho/Phuc cham tay)
        const medallion = new THREE.Mesh(
          new THREE.TorusGeometry(0.16, 0.02, 8, 24),
          familyGoldMat,
        );
        medallion.position.set(0, 0.5, -0.33);
        g.add(medallion);
        const medallionCenter = new THREE.Mesh(
          new THREE.CircleGeometry(0.13, 24),
          lotusScreenMat,
        );
        medallionCenter.position.set(0, 0.5, -0.34);
        g.add(medallionCenter);

        // cuon thu (scroll) hai ben chan binh phong
        const scrollGeo = new THREE.TorusGeometry(0.09, 0.05, 10, 20);
        [-0.48, 0.48].forEach((sx) => {
          const scroll = new THREE.Mesh(scrollGeo, lotusScreenMat);
          scroll.position.set(sx, 0.2, -0.3);
          scroll.rotation.y = Math.PI / 2;
          scroll.castShadow = true;
          g.add(scroll);
        });

        // be tron phia truoc, hoa sen no
        const basin = new THREE.Mesh(
          new THREE.CylinderGeometry(0.55, 0.6, 0.16, 24),
          lotusBasinMat,
        );
        basin.position.y = 0.08;
        basin.castShadow = true;
        basin.receiveShadow = true;
        g.add(basin);
        const basinRim = new THREE.Mesh(
          new THREE.TorusGeometry(0.55, 0.035, 8, 24),
          lotusBasinMat,
        );
        basinRim.position.y = 0.16;
        basinRim.rotation.x = Math.PI / 2;
        g.add(basinRim);
        const water = new THREE.Mesh(
          new THREE.CircleGeometry(0.48, 24),
          lotusWaterMat,
        );
        water.rotation.x = -Math.PI / 2;
        water.position.y = 0.165;
        g.add(water);

        [
          [-0.16, 0.05],
          [0, 0.14],
          [0.16, 0.05],
        ].forEach(([fx, fz]) => {
          g.add(buildLotusFlower(fx, 0.165, fz, 1));
          g.add(buildLotusPad(fx + 0.1, 0.167, fz - 0.09, 1));
        });

        g.position.set(px, 0, pz);
        g.rotation.y = rotY || 0;
        g.scale.setScalar(scale || 1);
        scene.add(g);
      }

      // dat mot dai hoa sen o moi khoang trong giua 4 cum nho C1-C4
      function buildLotusAltarsForZoneC() {
        const layout = LAYOUT.C;
        const rects = familyGroupRects(layout);
        const cx = wx(layout.x + layout.w / 2);
        for (let i = 0; i < rects.length - 1; i++) {
          const gapStart = rects[i].y + rects[i].h;
          const gapEnd = rects[i + 1].y;
          const midY = (gapStart + gapEnd) / 2;
          buildLotusAltar(cx, wz(midY), 0, 1);
        }
      }

      function buildFamilyClusters() {
        const rects = familyGroupRects(LAYOUT.C);
        let famCount = 0;
        const blockCols = 5,
          blockRows = 5; // moi khoi 5x5 = 25 mo, 2 khoi = 50 mo/cum
        rects.forEach((r, idx) => {
          const worldW = r.w * SC,
            worldH = r.h * SC;
          const cx = wx(r.x + r.w / 2),
            cz = wz(r.y + r.h / 2);
          const marginX = 0.55,
            marginZ = 0.5,
            pathWidth = 0.85;

          const usableW = worldW - marginX * 2 - pathWidth;
          const blockW = usableW / 2;
          const colW = blockW / blockCols;
          const usableH = worldH - marginZ * 2;
          const rowH = usableH / blockRows;
          const tombScale = Math.max(
            0.32,
            Math.min(colW / 1.25, rowH / 1.75, 0.85),
          );

          // 2 khoi 25 mo, ngan cach boi loi di chinh giua (khong xay thap o giua)
          [-1, 1].forEach((side) => {
            const blockStartX =
              side < 0 ? -(pathWidth / 2 + blockW) : pathWidth / 2;
            for (let row = 0; row < blockRows; row++) {
              for (let col = 0; col < blockCols; col++) {
                const x = cx + blockStartX + (col + 0.5) * colW;
                const z = cz - usableH / 2 + (row + 0.5) * rowH;
                buildFamilyTomb(x, z, 0, tombScale);
                famCount++;
              }
            }
          });

          // loi di trung tam (giua 2 khoi 25 mo)
          const path = new THREE.Mesh(
            new THREE.BoxGeometry(pathWidth, 0.03, worldH * 0.94),
            familyPathMat,
          );
          path.position.set(cx, 0.015, cz);
          path.receiveShadow = true;
          scene.add(path);

          // binh hoa doc theo loi di, hai ben xen ke
          const vaseCount = 6;
          for (let i = 0; i < vaseCount; i++) {
            const t = (i + 0.5) / vaseCount - 0.5;
            const vz = cz + t * worldH * 0.85;
            buildFlowerVase(cx - pathWidth / 2 - 0.16, vz, 0.9);
            buildFlowerVase(cx + pathWidth / 2 + 0.16, vz, 0.9);
          }
          // dinh huong nho o dau loi di (khong phai thap, chi la vat pham nho)
          buildIncenseBurner(cx, cz - worldH / 2 + marginZ * 0.55, 0.85);

          // hang rao da quanh cum
          const fence = buildFamilyFence(worldW - 0.3, worldH - 0.3);
          fence.position.set(cx, 0, cz);
          scene.add(fence);
        });
        zoneCellCounts.C = famCount;
      }
      buildFamilyClusters();
      buildLotusAltarsForZoneC();

      /* ------------------------------------------------------------------
       * Bo da noi that san vuon dung chung: ghe da (mat + tua lung + chan
       * cong lieu) va bo ban tron + ghe don da (kieu san vuon truyen thong),
       * tham chieu 2 anh mau nguoi dung gui.
       * ------------------------------------------------------------------ */
      const gardenStoneMat = new THREE.MeshStandardMaterial({
        color: GRANITE_WHITE_GRAY,
        map: graniteRealAlbedo,
        normalMap: graniteRealNormal,
        normalScale: new THREE.Vector2(0.7, 0.7),
        roughnessMap: graniteRealRough,
        roughness: 0.68,
        metalnessMap: graniteRealMetal,
        metalness: 0.08,
        envMapIntensity: 0.85,
      });

      // chan ghe da hinh cong (S-curve) tu mat dat len do ghe roi vong len do tua lung
      const benchLegCurve = new THREE.CatmullRomCurve3([
        new THREE.Vector3(0, 0.0, 0.2),
        new THREE.Vector3(0, 0.1, 0.17),
        new THREE.Vector3(0, 0.22, 0.1),
        new THREE.Vector3(0, 0.34, 0.02),
        new THREE.Vector3(0, 0.42, -0.03),
        new THREE.Vector3(0, 0.58, -0.1),
        new THREE.Vector3(0, 0.74, -0.18),
        new THREE.Vector3(0, 0.9, -0.24),
      ]);
      const benchLegGeo = new THREE.TubeGeometry(
        benchLegCurve,
        24,
        0.045,
        8,
        false,
      );

      function buildStoneBench(px, pz, rotY) {
        const g = new THREE.Group();
        const legL = new THREE.Mesh(benchLegGeo, gardenStoneMat);
        legL.position.set(-0.58, 0, 0);
        legL.castShadow = true;
        legL.receiveShadow = true;
        const legR = new THREE.Mesh(benchLegGeo, gardenStoneMat);
        legR.position.set(0.58, 0, 0);
        legR.castShadow = true;
        legR.receiveShadow = true;
        g.add(legL, legR);
        const seat = new THREE.Mesh(
          new THREE.BoxGeometry(1.3, 0.06, 0.42),
          gardenStoneMat,
        );
        seat.position.set(0, 0.42, -0.02);
        seat.castShadow = true;
        seat.receiveShadow = true;
        g.add(seat);
        const back = new THREE.Mesh(
          new THREE.BoxGeometry(1.3, 0.5, 0.06),
          gardenStoneMat,
        );
        back.position.set(0, 0.68, -0.22);
        back.rotation.x = -0.18;
        back.castShadow = true;
        back.receiveShadow = true;
        g.add(back);
        g.position.set(px, 0, pz);
        g.rotation.y = rotY || 0;
        scene.add(g);
        return g;
      }

      // bo ban tron da + 4 ghe don da (drum stool) quanh ban, kieu san vuon
      function buildStoneTableSet(px, pz, rotY) {
        const g = new THREE.Group();
        const pedestal = new THREE.Mesh(
          new THREE.CylinderGeometry(0.2, 0.24, 0.4, 16),
          gardenStoneMat,
        );
        pedestal.position.y = 0.2;
        pedestal.castShadow = true;
        pedestal.receiveShadow = true;
        g.add(pedestal);
        const top = new THREE.Mesh(
          new THREE.CylinderGeometry(0.56, 0.56, 0.06, 28),
          gardenStoneMat,
        );
        top.position.y = 0.43;
        top.castShadow = true;
        top.receiveShadow = true;
        g.add(top);
        for (let i = 0; i < 4; i++) {
          const a = (i / 4) * Math.PI * 2 + Math.PI / 4;
          const stool = new THREE.Mesh(
            new THREE.CylinderGeometry(0.19, 0.22, 0.38, 14),
            gardenStoneMat,
          );
          stool.position.set(Math.cos(a) * 0.92, 0.19, Math.sin(a) * 0.92);
          stool.castShadow = true;
          stool.receiveShadow = true;
          g.add(stool);
        }
        g.position.set(px, 0, pz);
        g.rotation.y = rotY || 0;
        scene.add(g);
        return g;
      }

      /* ------------------------------------------------------------------
       * Thanh (tuong da thap) bao quanh toan bo Khu C - Lo gia toc (khu mo
       * lon ben phai ban do), chua co san o cac khu con lai nen chi lam
       * rieng cho khu nay. Co 2 loi vao (Bac/Nam) khop voi duong noi bo
       * doc theo x=1297, va bon hoa trong doc theo mat ngoai tuong.
       * ------------------------------------------------------------------ */
      (function buildZoneCWall() {
        const layout = LAYOUT.C;
        const cx = wx(layout.x + layout.w / 2),
          cz = wz(layout.y + layout.h / 2);
        const rectW = layout.w * SC + 0.7,
          rectH = layout.h * SC + 0.7;
        const hw = rectW / 2,
          hh = rectH / 2;

        // doi mau tuong/tru sang trang da cam thach, dong bo voi mo va ghe da
        // Khu C (theo anh mau: hang rao da trang xam co hoa van cham khac)
        const wallBodyMat = new THREE.MeshStandardMaterial({
          color: 0xdcd9cc,
          map: familyStoneTex,
          normalMap: graniteRealNormal,
          normalScale: new THREE.Vector2(0.4, 0.4),
          roughnessMap: graniteRealRough,
          roughness: 0.55,
          metalnessMap: graniteRealMetal,
          metalness: 0.05,
          envMapIntensity: 0.9,
        });
        const wallCapMat = new THREE.MeshStandardMaterial({
          color: 0xc9c5b6,
          roughness: 0.5,
        });
        const pillarMat = new THREE.MeshStandardMaterial({
          color: 0xd2cfc0,
          map: familyStoneTex,
          normalMap: graniteRealNormal,
          normalScale: new THREE.Vector2(0.35, 0.35),
          roughness: 0.55,
          envMapIntensity: 0.9,
        });

        const wallH = 0.5,
          wallThick = 0.12,
          capH = 0.06;
        const gateGap = 1.7; // khoang ho lam loi vao, khop voi duong noi bo giua khu
        const pillarSpacing = 2.4;
        const pillarSize = 0.22,
          pillarH = wallH + 0.28;

        const wallGroup = new THREE.Group();

        function addWallSeg(x1, z1, x2, z2) {
          const dx = x2 - x1,
            dz = z2 - z1;
          const len = Math.hypot(dx, dz);
          if (len < 0.05) return;
          const seg = new THREE.Mesh(
            new THREE.BoxGeometry(len, wallH, wallThick),
            wallBodyMat,
          );
          seg.position.set((x1 + x2) / 2, wallH / 2, (z1 + z2) / 2);
          seg.rotation.y = -Math.atan2(dz, dx);
          seg.castShadow = true;
          seg.receiveShadow = true;
          wallGroup.add(seg);
          const cap = new THREE.Mesh(
            new THREE.BoxGeometry(len + 0.05, capH, wallThick + 0.05),
            wallCapMat,
          );
          cap.position.set((x1 + x2) / 2, wallH + capH / 2, (z1 + z2) / 2);
          cap.rotation.y = seg.rotation.y;
          cap.castShadow = true;
          cap.receiveShadow = true;
          wallGroup.add(cap);
          const n = Math.max(1, Math.round(len / pillarSpacing));
          for (let i = 1; i < n; i++) {
            const t = i / n;
            const px = x1 + dx * t,
              pz = z1 + dz * t;
            const p = new THREE.Mesh(
              new THREE.BoxGeometry(pillarSize, pillarH, pillarSize),
              pillarMat,
            );
            p.position.set(px, pillarH / 2, pz);
            p.castShadow = true;
            p.receiveShadow = true;
            wallGroup.add(p);
            // chom hoa sen nho tren dinh tru, tham chieu anh mau (tru co dinh
            // hinh nu sen thay vi dinh vuong tron)
            const bud = new THREE.Mesh(
              new THREE.ConeGeometry(pillarSize * 0.6, 0.16, 8),
              wallCapMat,
            );
            bud.position.set(px, pillarH + 0.08, pz);
            bud.castShadow = true;
            wallGroup.add(bud);
            const budTip = new THREE.Mesh(
              new THREE.SphereGeometry(pillarSize * 0.22, 8, 6),
              wallCapMat,
            );
            budTip.position.set(px, pillarH + 0.16, pz);
            wallGroup.add(budTip);
          }
          // phu dieu hinh tron (dong tien / hoa van) giua mang tuong, tham chieu
          // hoa van cham khac tren hang rao trong anh mau - chi them cho doan du dai
          if (len > 1.6) {
            const midX = (x1 + x2) / 2,
              midZ = (z1 + z2) / 2;
            const rotY = -Math.atan2(dz, dx);
            const medOuter = new THREE.Mesh(
              new THREE.TorusGeometry(wallH * 0.3, 0.018, 8, 20),
              wallCapMat,
            );
            medOuter.position.set(midX, wallH * 0.55, midZ);
            medOuter.rotation.y = rotY;
            wallGroup.add(medOuter);
            const medInner = new THREE.Mesh(
              new THREE.CircleGeometry(wallH * 0.24, 16),
              wallCapMat,
            );
            medInner.position.set(midX, wallH * 0.55, midZ);
            medInner.rotation.y = rotY;
            wallGroup.add(medInner);
          }
        }
        function addCornerPillar(px, pz) {
          const p = new THREE.Mesh(
            new THREE.BoxGeometry(
              pillarSize * 1.3,
              pillarH + 0.1,
              pillarSize * 1.3,
            ),
            pillarMat,
          );
          p.position.set(px, (pillarH + 0.1) / 2, pz);
          p.castShadow = true;
          p.receiveShadow = true;
          wallGroup.add(p);
          const cap = new THREE.Mesh(
            new THREE.ConeGeometry(pillarSize * 0.85, 0.24, 8),
            wallCapMat,
          );
          cap.position.set(px, pillarH + 0.1 + 0.12, pz);
          cap.castShadow = true;
          wallGroup.add(cap);
          const capTip = new THREE.Mesh(
            new THREE.SphereGeometry(pillarSize * 0.3, 8, 6),
            wallCapMat,
          );
          capTip.position.set(px, pillarH + 0.1 + 0.24, pz);
          wallGroup.add(capTip);
        }

        addCornerPillar(cx - hw, cz - hh);
        addCornerPillar(cx + hw, cz - hh);
        addCornerPillar(cx - hw, cz + hh);
        addCornerPillar(cx + hw, cz + hh);

        // canh trai / phai - kin, khong co cong
        addWallSeg(cx - hw, cz - hh, cx - hw, cz + hh);
        addWallSeg(cx + hw, cz - hh, cx + hw, cz + hh);
        // canh tren / duoi - chua khoang ho o giua lam loi vao
        addWallSeg(cx - hw, cz - hh, cx - gateGap / 2, cz - hh);
        addWallSeg(cx + gateGap / 2, cz - hh, cx + hw, cz - hh);
        addWallSeg(cx - hw, cz + hh, cx - gateGap / 2, cz + hh);
        addWallSeg(cx + gateGap / 2, cz + hh, cx + hw, cz + hh);

        scene.add(wallGroup);

        // bon hoa doc theo mat ngoai tuong
        const bedFlowerMat = new THREE.MeshStandardMaterial({
          color: 0xc23b3b,
          roughness: 0.6,
        });
        const bedSoilMat = new THREE.MeshStandardMaterial({
          color: 0x2f5a37,
          roughness: 0.85,
        });
        const bedBoxMat = new THREE.MeshStandardMaterial({
          color: 0x8f8a78,
          roughness: 0.85,
        });
        function addFlowerBed(px, pz, rotY) {
          const g = new THREE.Group();
          const box = new THREE.Mesh(
            new THREE.BoxGeometry(0.62, 0.16, 0.28),
            bedBoxMat,
          );
          box.position.y = 0.08;
          box.castShadow = true;
          box.receiveShadow = true;
          g.add(box);
          const soil = new THREE.Mesh(
            new THREE.BoxGeometry(0.54, 0.03, 0.2),
            bedSoilMat,
          );
          soil.position.y = 0.17;
          g.add(soil);
          for (let i = 0; i < 5; i++) {
            const fx = -0.22 + i * 0.11;
            const fl = new THREE.Mesh(
              new THREE.SphereGeometry(0.06, 7, 6),
              bedFlowerMat,
            );
            fl.position.set(fx, 0.23, (Math.random() - 0.5) * 0.06);
            fl.castShadow = true;
            g.add(fl);
          }
          g.position.set(px, 0, pz);
          g.rotation.y = rotY || 0;
          scene.add(g);
        }
        const bedOffset = 0.35,
          bedSpacing = 2.2;
        ["left", "right"].forEach((edge) => {
          const x = edge === "left" ? cx - hw - bedOffset : cx + hw + bedOffset;
          const n = Math.max(1, Math.round(rectH / bedSpacing));
          for (let i = 0; i <= n; i++)
            addFlowerBed(x, cz - hh + (i / n) * rectH, Math.PI / 2);
        });
        ["front", "back"].forEach((edge) => {
          const z =
            edge === "front" ? cz - hh - bedOffset : cz + hh + bedOffset;
          const n = Math.max(1, Math.round(rectW / bedSpacing));
          for (let i = 0; i <= n; i++) {
            const x = cx - hw + (i / n) * rectW;
            if (Math.abs(x - cx) < gateGap / 2 + 0.3) continue; // chua loi vao
            addFlowerBed(x, z, 0);
          }
        });

        // canh trai (phia Tay) dang trong trai - trong 1 hang cay da dang (moi cay
        // mot loai/kich thuoc khac nhau, khong lap lai giong het nhau), va ghe da
        // dat gan phia duong di ben ngoai (khong sat tuong), cach tuong mot khoang.
        const treeOffset = 0.75;
        const treeX = cx - hw - treeOffset;
        const treeCount = Math.max(2, Math.round(rectH / 4));
        for (let i = 0; i <= treeCount; i++) {
          const t = i / treeCount;
          const tz = cz - hh + t * rectH + (Math.random() - 0.5) * 0.7;
          const tx = treeX + (Math.random() - 0.5) * 0.7;
          // khong ep kind -> makeTree tu random giua normal/shrub/tallpine va doi mau
          // la ngau nhien, nen moi cay tu nhien khac nhau, khong trong hang loat dong bo
          makeTree(tx, tz, 0.65 + Math.random() * 1.0);
        }

        const benchOffset = 1.25; // cach tuong ra xa hon, nam gan sat phia duong di ben ngoai
        const benchX = cx - hw - benchOffset;
        const benchCount = Math.max(2, Math.round(rectH / 7));
        for (let i = 0; i < benchCount; i++) {
          const t = (i + 0.5) / benchCount;
          const bz = cz - hh + t * rectH;
          buildStoneBench(benchX, bz, Math.PI / 2); // quay mat vao huong tuong/khu mo
        }
      })();

      /* ------------------------------------------------------------------
       * Khoang trong canh Khu H (giua Khu H va Khu C, phia duoi Khu G) -
       * dat 4 bo ban ghe da san vuon (tham chieu anh mau), giua la mot
       * cay co thu to lam diem nhan.
       * ------------------------------------------------------------------ */
      (function buildHRestArea() {
        // vung trong khong thuoc LAYOUT nao: giua duong x=445-475 (canh Khu H) va
        // duong x=880-910 (bien Dong), giua duong y=1202-1228 (duoi Khu G) va
        // duong bien Nam y=1524-1550.
        const areaX0 = 475,
          areaX1 = 880,
          areaY0 = 1228,
          areaY1 = 1524;
        const cx = wx((areaX0 + areaX1) / 2),
          cz = wz((areaY0 + areaY1) / 2);
        const spanX = wx(areaX1 - areaX0),
          spanZ = wz(areaY1 - areaY0);

        // cay co thu to o giua, cao lon han han cay vien thuong
        makeTree(cx, cz, 2.6, "normal");
        const curbMatH = new THREE.MeshStandardMaterial({
          color: 0x8f8a78,
          map: stoneTex,
          roughness: 0.85,
        });
        const treeCurb = new THREE.Mesh(
          new THREE.RingGeometry(0.95, 1.18, 32),
          curbMatH,
        );
        treeCurb.rotation.x = -Math.PI / 2;
        treeCurb.position.set(cx, 0.02, cz);
        treeCurb.receiveShadow = true;
        scene.add(treeCurb);

        // 4 bo ban + ghe don da, dat 4 goc quanh cay, xoay huong vao trong
        const offX = Math.min(spanX * 0.28, 2.7),
          offZ = Math.min(spanZ * 0.28, 1.9);
        [
          [-offX, -offZ],
          [offX, -offZ],
          [-offX, offZ],
          [offX, offZ],
        ].forEach(([dx, dz]) => {
          buildStoneTableSet(
            cx + dx,
            cz + dz,
            Math.atan2(-dz, -dx) + Math.PI / 2,
          );
        });
      })();

      // zone platforms + labels
      const zoneCenters = {};
      const labelLayer = new THREE.Group();
      scene.add(labelLayer);

      function makeLabel(text, cls) {
        const div = document.createElement("div");
        div.className = "label" + (cls ? " " + cls : "");
        div.textContent = text;
        return new THREE.CSS2DObject(div);
      }

      Object.keys(LAYOUT).forEach((key) => {
        const layout = LAYOUT[key];
        const color = ZONES[key].color;
        // Theo yeu cau: bo HOAN TOAN lop lot/tham duoi tat ca cac khu mo (khong
        // chi rieng Khu C nua) - mo nam truc tiep tren lop co that, khong con
        // mieng "tham" nao xen giua nua. Giu mesh vo hinh (opacity 0) de van
        // bam/zoom duoc vao khu.
        const platMat = new THREE.MeshStandardMaterial({
          color,
          roughness: 0.9,
          transparent: true,
          opacity: 0,
          depthWrite: false,
        });
        const isFamilyZone = key === "C";
        groupBackdrops(layout).forEach((bd) => {
          const geo = new THREE.BoxGeometry(bd.w * SC, PLATFORM_H, bd.h * SC);
          const mesh = new THREE.Mesh(geo, platMat);
          mesh.position.set(
            wx(bd.x) + (bd.w * SC) / 2,
            PLATFORM_H / 2,
            wz(bd.y) + (bd.h * SC) / 2,
          );
          mesh.userData.zoneKey = key;
          mesh.castShadow = !isFamilyZone;
          mesh.receiveShadow = !isFamilyZone;
          scene.add(mesh);
        });
        const ccx = wx(layout.x + layout.w / 2),
          ccz = wz(layout.y + layout.h / 2);
        zoneCenters[key] = {
          x: ccx,
          z: ccz,
          w: layout.w * SC,
          h: layout.h * SC,
        };

        const label = makeLabel(ZONES[key].name);
        label.position.set(ccx, PLATFORM_H + 1.1, wz(layout.y) - 0.3);
        label.element.onclick = () => flyToZone(key);
        labelLayer.add(label);
      });

      const lakeLabel = makeLabel("Khu tâm linh", "poi");
      lakeLabel.position.set(lakeCenter.x, 1.0, lakeCenter.z);
      labelLayer.add(lakeLabel);

      // gates
      /* ------------------------------------------------------------------
       * Cong chinh / cong phu: dung model that (front_door_of_a_mansion3.glb -
       * cong sat hoa van vang-den + tru da chop nhon), thay cho khoi hop don
       * gian truoc day. Tuong thanh bao quanh TOAN BO ranh gioi (BOUNDARY):
       * ghep lien tiep tu module wall_door.glb (tuong gach + tru tron + hang
       * rao sat phia tren, co san cong nho), tu dong chua khoang ho dung ngay
       * vi tri cong chinh/cong phu. Tai bang GLTFLoader (dung chung co che voi
       * cay that o tren), clone cho tung vi tri sau khi tai xong.
       * ------------------------------------------------------------------ */
      function placeGateModel(model, gx, gy, rotY, scaleVal, label) {
        const clone = model.clone(true);
        const px = wx(gx),
          pz = wz(gy);
        clone.position.set(px, 0, pz);
        clone.rotation.y = rotY;
        clone.scale.setScalar(scaleVal);
        scene.add(clone);
        if (label) {
          const lbl = makeLabel(label, "gate");
          lbl.position.set(px, 3.4 * scaleVal, pz);
          labelLayer.add(lbl);
        }
      }
      function placeGateModels(model) {
        // cong chinh: kich thuoc goc (mo hinh cong biet thu thuc te ~5.5m rong),
        // quay mat huong ra phia truoc khu dat (Nam); cong phu dung cung kieu
        // nhung nho hon de phan cap do quan trong so voi cong chinh.
        placeGateModel(
          model,
          MAP_GATE.x,
          MAP_GATE.y,
          Math.PI,
          0.55,
          "Cổng chính",
        );
        placeGateModel(
          model,
          SECONDARY_GATE.x,
          SECONDARY_GATE.y,
          Math.PI,
          0.42,
          "Cổng phụ",
        );
      }

      (function loadGateAndWallModels() {
        if (typeof THREE.GLTFLoader === "undefined") return;
        const loader = new THREE.GLTFLoader();
        loader.load(
          "assets/models/gates/front_door_of_a_mansion3.glb",
          (gltf) => {
            gltf.scene.traverse((n) => {
              if (n.isMesh) {
                n.castShadow = true;
                n.receiveShadow = true;
              }
            });
            placeGateModels(gltf.scene);
          },
          undefined,
          (err) =>
            console.warn("khong tai duoc model cong chinh/cong phu", err),
        );
        // Theo yeu cau: BO tuong thanh bao quanh, de trong nhu cu (chi vanh
        // cay bao quanh nhu truoc). Khong con tai wall_door.glb nua de tranh
        // ton bang thong/thoi gian load (file nay khong con dung toi).
      })();

      /* ------------------------------------------------------------------
       * Camera + controls
       * ------------------------------------------------------------------ */
      const introOffset = new THREE.Vector3(-22, 26, 26);
      camera.position.set(sceneCenter.x - 55, 50, sceneCenter.z + 60);
      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.copy(sceneCenter);
      controls.enableDamping = true;
      controls.dampingFactor = 0.07;
      controls.minDistance = 3;
      controls.maxDistance = 75;
      controls.maxPolarAngle = Math.PI * 0.49;
      controls.enablePan = true;
      controls.screenSpacePanning = false;
      controls.panSpeed = 0.8;
      controls.rotateSpeed = 0.75;
      controls.zoomSpeed = 0.9;
      controls.touches = {
        ONE: THREE.TOUCH.ROTATE,
        TWO: THREE.TOUCH.DOLLY_PAN,
      };
      controls.autoRotate = true;
      controls.autoRotateSpeed = 0.35;
      controls.update();

      let idleTimer = null;
      controls.addEventListener("start", () => {
        controls.autoRotate = false;
        document.getElementById("rotateBtn").classList.remove("active");
        clearTimeout(idleTimer);
      });
      controls.addEventListener("end", () => {
        clearTimeout(idleTimer);
        idleTimer = setTimeout(() => {
          controls.autoRotate = true;
          document.getElementById("rotateBtn").classList.add("active");
        }, 7000);
      });
      document.getElementById("rotateBtn").classList.add("active");

      /* ------------------------------------------------------------------
       * Dong bo huong (la ban) + zoom sang minimap 2D o trang React cha
       * (qua postMessage, chi khi nhung trong iframe). Chi anh huong TRUC
       * XOAY DOC (huong dong/tay/nam/bac) - khong dong bo goc nhin nghieng
       * (polar angle), dung nhu yeu cau: minimap 2D chi xoay theo la ban.
       *
       * NORTH_OFFSET_DEG: do lech (do) giua goc "0" cua getAzimuthalAngle()
       * trong scene 3D nay va huong Bac that cua ban do 2D. Neu sau khi tich
       * hop thay minimap xoay lech so voi huong thuc te nhin thay trong 3D,
       * chinh lai gia tri nay (vi du: quay canh o che do toan canh cho
       * huong ve dung huong Bac, roi doc headingDeg in ra console va gan
       * NORTH_OFFSET_DEG = -headingDeg do luc do).
       * ------------------------------------------------------------------ */
      const NORTH_OFFSET_DEG = 0;
      const ORBIT_REF_DISTANCE = introOffset.length();
      let __lastOrbitSync = 0;
      function sendOrbitState(force) {
        if (!window.parent || window.parent === window) return;
        const now = performance.now();
        if (!force && now - __lastOrbitSync < 80) return; // ~12fps la du muot cho minimap
        __lastOrbitSync = now;
        const headingDeg =
          (THREE.MathUtils.radToDeg(controls.getAzimuthalAngle()) +
            NORTH_OFFSET_DEG +
            360) %
          360;
        const distance = camera.position.distanceTo(controls.target);
        const zoomRatio = Math.min(
          4,
          Math.max(0.5, ORBIT_REF_DISTANCE / Math.max(1, distance)),
        );
        try {
          window.parent.postMessage(
            { type: "vpv3d:orbit", headingDeg, zoomRatio },
            "*",
          );
        } catch (e) {}
      }
      controls.addEventListener("change", () => sendOrbitState(false));

      function zoomBy(f) {
        const dir = new THREE.Vector3().subVectors(
          camera.position,
          controls.target,
        );
        dir.multiplyScalar(f);
        camera.position.copy(controls.target).add(dir);
      }
      function toggleAutoRotate() {
        controls.autoRotate = !controls.autoRotate;
        document
          .getElementById("rotateBtn")
          .classList.toggle("active", controls.autoRotate);
        clearTimeout(idleTimer);
      }

      let flyAnim = null;
      function flyTo(targetPos, camOffset, duration) {
        const startCam = camera.position.clone();
        const startTarget = controls.target.clone();
        const endTarget = targetPos.clone();
        const endCam = targetPos.clone().add(camOffset);
        const t0 = performance.now();
        flyAnim = function (now) {
          const t = Math.min(1, (now - t0) / duration);
          const e = t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t;
          camera.position.lerpVectors(startCam, endCam, e);
          controls.target.lerpVectors(startTarget, endTarget, e);
          controls.update();
          if (t >= 1) flyAnim = null;
        };
      }

      function flyToZone(key) {
        const c = zoneCenters[key];
        const target = new THREE.Vector3(c.x, 0, c.z);
        const span = Math.max(c.w, c.h);
        const offset = new THREE.Vector3(-span * 0.55, span * 0.85, span * 0.9);
        flyTo(target, offset, 900);
        showInfo(key);
        if (window.setCinematicFocus)
          window.setCinematicFocus("inspect", offset.length() * 1.15);
      }
      function flyToOverview() {
        flyTo(sceneCenter, introOffset, 900);
        document.getElementById("info").style.display = "none";
        if (window.setCinematicFocus)
          window.setCinematicFocus("overview", introOffset.length() * 2.2);
      }

      function showInfo(key) {
        const z = ZONES[key];
        document.getElementById("infoTitle").textContent = z.name;
        document.getElementById("infoBody").textContent =
          z.blurb +
          " Giá tham khảo: " +
          z.price +
          ". Số lô: " +
          zoneCellCounts[key] +
          ".";
        document.getElementById("info").style.display = "block";
      }

      // legend list
      const zoneListEl = document.getElementById("zoneList");
      Object.keys(ZONES).forEach((key) => {
        const z = ZONES[key];
        const btn = document.createElement("button");
        btn.className = "zbtn";
        btn.innerHTML =
          '<span class="sw" style="background:#' +
          z.color.toString(16).padStart(6, "0") +
          '"></span>' +
          z.name +
          '<span class="cnt">' +
          zoneCellCounts[key] +
          "</span>";
        btn.onclick = () => flyToZone(key);
        zoneListEl.appendChild(btn);
      });

      // raycast click on platforms + lake
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      renderer.domElement.addEventListener("click", (e) => {
        pointer.x = (e.clientX / window.innerWidth) * 2 - 1;
        pointer.y = -(e.clientY / window.innerHeight) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hits = raycaster.intersectObjects(
          scene.children.filter((o) => o.userData && o.userData.zoneKey),
        );
        if (hits.length) {
          const key = hits[0].object.userData.zoneKey;
          showInfo(key);
          return;
        }
        const lakeHit = raycaster.intersectObject(lakeMesh);
        if (lakeHit.length) {
          document.getElementById("infoTitle").textContent = "Khu tâm linh";
          document.getElementById("infoBody").textContent =
            "Không gian tĩnh lặng giữa khu đất, tạo điều kiện phong thủy hài hòa cho toàn bộ các khu mộ xung quanh.";
          document.getElementById("info").style.display = "block";
        }
      });

      /* ------------------------------------------------------------------
       * Ap dung PBR environment reflection cho toan bo scene
       * (chay 1 lan sau khi da dung xong toan bo geometry/material o tren)
       * ------------------------------------------------------------------ */
      (function finalizePBR() {
        scene.traverse((obj) => {
          if (!obj.isMesh || !obj.material) return;
          const mats = Array.isArray(obj.material)
            ? obj.material
            : [obj.material];
          mats.forEach((m) => {
            if (!m || !m.isMeshStandardMaterial) return;
            // da / granite / be tong hoi phan xa moi truong nhe -> cam giac "uot", co chieu sau
            const rough = m.roughness !== undefined ? m.roughness : 1;
            m.envMapIntensity =
              m.metalness > 0.3 ? 1.1 : rough < 0.7 ? 0.55 : 0.22;
            if (m.map) m.map.anisotropy = MAX_ANISO;
          });
        });
      })();

      /* ------------------------------------------------------------------
       * Postprocessing pipeline dang cinematic:
       * Render -> SSAO (ambient occlusion / contact toi cac ke, chan vat) ->
       * Bloom nhe -> Depth of Field (chi ro khu duoc chon, mo nen truoc/sau) ->
       * Color grading + vignette + film grain rat nhe -> man hinh
       * ------------------------------------------------------------------ */
      const composer = new THREE.EffectComposer(renderer);
      composer.addPass(new THREE.RenderPass(scene, camera));

      // SSAO: chi bat neu thu vien load thanh cong (phong thu CDN loi mang)
      let ssaoPass = null;
      if (typeof THREE.SSAOPass !== "undefined") {
        try {
          ssaoPass = new THREE.SSAOPass(
            scene,
            camera,
            window.innerWidth,
            window.innerHeight,
          );
          ssaoPass.kernelRadius = 0.55;
          ssaoPass.minDistance = 0.0008;
          ssaoPass.maxDistance = 0.06;
          ssaoPass.output = THREE.SSAOPass.OUTPUT.Default;
          composer.addPass(ssaoPass);
        } catch (e) {
          console.warn("SSAO khong kha dung, bo qua:", e);
        }
      }

      // giam strength (0.26->0.16->0.13) va nang threshold de anh sang/nuoc khong
      // bi loe trang xoa - bloom chi de "tho" nhe cho highlight, khong tao cam giac fantasy
      const bloomPass = new THREE.UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.13,
        0.34,
        0.97,
      );
      composer.addPass(bloomPass);

      // Depth of field: mo nen/tien canh nhe khi o che do tong quan/bay toi khu,
      // tat han khi nguoi dung dang xem chi tiet/chon lo de khong che thong tin
      let bokehPass = null;
      if (typeof THREE.BokehPass !== "undefined") {
        try {
          bokehPass = new THREE.BokehPass(scene, camera, {
            focus: 20,
            aperture: 0.00018,
            maxblur: 0.008,
            width: window.innerWidth,
            height: window.innerHeight,
          });
          bokehPass.enabled = false;
          composer.addPass(bokehPass);
        } catch (e) {
          console.warn("DOF khong kha dung, bo qua:", e);
        }
      }
      // dieu khien DOF theo che do camera: goi ham nay tu flyTo/overview
      window.setCinematicFocus = function (mode, focusDist) {
        if (!bokehPass) return;
        if (mode === "overview") {
          bokehPass.enabled = true;
          bokehPass.uniforms["focus"].value = focusDist || 55;
          bokehPass.uniforms["aperture"].value = 0.00012;
        } else if (mode === "inspect") {
          bokehPass.enabled = true;
          bokehPass.uniforms["focus"].value = focusDist || 18;
          bokehPass.uniforms["aperture"].value = 0.00022;
        } else {
          bokehPass.enabled = false;
        }
      };

      // Color grading + vignette + film grain rat nhe (khong can thu vien ngoai,
      // dam bao luon chay du CDN loi) - muc tieu: anh sang that truoc, cinematic sau
      const gradeShader = {
        uniforms: {
          tDiffuse: { value: null },
          uTime: { value: 0 },
          uVignette: { value: 0.32 },
          uGrain: { value: 0.018 },
          uContrast: { value: 1.06 },
          uSaturation: { value: 1.08 },
          uWarmth: { value: 0.03 },
        },
        vertexShader: `varying vec2 vUv; void main(){ vUv = uv; gl_Position = projectionMatrix*modelViewMatrix*vec4(position,1.0); }`,
        fragmentShader: `
    uniform sampler2D tDiffuse; uniform float uTime, uVignette, uGrain, uContrast, uSaturation, uWarmth; varying vec2 vUv;
    float rand(vec2 co){ return fract(sin(dot(co.xy, vec2(12.9898,78.233))) * 43758.5453); }
    void main(){
      vec4 c = texture2D(tDiffuse, vUv);
      // contrast (filmic-ish, xoay quanh diem xam giua)
      c.rgb = (c.rgb - 0.5) * uContrast + 0.5;
      // saturation
      float g = dot(c.rgb, vec3(0.299,0.587,0.114));
      c.rgb = mix(vec3(g), c.rgb, uSaturation);
      // warmth nhe (nang, chieu hoang hon)
      c.rgb += vec3(uWarmth, uWarmth*0.35, -uWarmth*0.55);
      // vignette
      vec2 d = vUv - 0.5;
      float vig = smoothstep(0.85, 0.25, dot(d,d)*2.0);
      c.rgb *= mix(1.0-uVignette, 1.0, vig);
      // film grain rat nhe, doi theo thoi gian de khong dinh vao man hinh
      float n = (rand(vUv*vec2(1024.0,1024.0) + uTime) - 0.5) * uGrain;
      c.rgb += n;
      gl_FragColor = vec4(clamp(c.rgb,0.0,1.0), c.a);
    }`,
      };
      const gradePass = new THREE.ShaderPass(gradeShader);
      gradePass.renderToScreen = true;
      composer.addPass(gradePass);

      window.addEventListener("resize", () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
        labelRenderer.setSize(window.innerWidth, window.innerHeight);
        composer.setSize(window.innerWidth, window.innerHeight);
      });

      const clock = new THREE.Clock();
      function animate(now) {
        requestAnimationFrame(animate);
        const t = clock.getElapsedTime();
        if (flyAnim) flyAnim(now || performance.now());
        controls.update();

        waterUniforms.uTime.value = t;
        if (canalWaterUniforms) canalWaterUniforms.uTime.value = t;

        swayItems.forEach((s) => {
          if (s.isClumpField) {
            s.update(t);
            return;
          }
          // gio hai tan so (chinh + gio giat nhe) de tao cam giac tu nhien hon
          // thay vi mot sin thuan tuy deu deu nhu may lac; goc/than gan nhu dung yen,
          // tan la (f2) rung manh hon f1, dung nguyen tac "cang cao/xa goc cang rung nhieu"
          const w1 = Math.sin(t * 0.6 + s.phase) * s.amp;
          const w2 = Math.sin(t * 1.53 + s.phase * 1.7) * s.amp * 0.35;
          const w = w1 + w2;
          s.f1.rotation.z = w * 0.8;
          s.f2.rotation.z = -w * 1.15;
          s.f1.rotation.x = w * 0.32;
          s.f2.rotation.x = w * 0.22;
        });
        // Lac tan la cho cay 3D that (InstancedMesh) - gom toan bo tan la 1
        // loai cay vao 1 draw call, chi can cap nhat lai ma tran instance moi
        // frame (re hon nhieu so voi hang nghin Object3D/draw call rieng).
        // Giam tan so cap nhat (~20fps) de do tai CPU ma van nhin muot.
        if (!window.__lastLeafSway) window.__lastLeafSway = 0;
        if (t - window.__lastLeafSway > 0.05) {
          window.__lastLeafSway = t;
          const dummy =
            window.__leafDummy || (window.__leafDummy = new THREE.Object3D());
          leafSwayBatches.forEach((batch) => {
            batch.base.forEach((b) => {
              const w =
                Math.sin(t * 0.6 + b.phase) * b.amp +
                Math.sin(t * 1.4 + b.phase * 1.6) * b.amp * 0.4;
              dummy.position.set(b.x, 0, b.z);
              dummy.rotation.set(w * 0.5, b.rotY, w * 0.4);
              dummy.scale.setScalar(b.scale);
              dummy.updateMatrix();
              batch.mesh.setMatrixAt(b.i, dummy.matrix);
            });
            batch.mesh.instanceMatrix.needsUpdate = true;
          });
        }

        if (window.__waterArcs)
          window.__waterArcs.forEach((a) => {
            a.mesh.material.opacity = 0.28 + 0.14 * Math.sin(t * 2.6 + a.phase);
          });
        if (window.__smallJets)
          window.__smallJets.forEach((j) => {
            const s = 0.9 + 0.15 * Math.sin(t * 3.1 + j.phase);
            j.mesh.scale.y = s;
            j.mesh.material.opacity = 0.26 + 0.16 * Math.sin(t * 3.1 + j.phase);
          });
        if (window.__centerJet) {
          const s = 0.95 + 0.08 * Math.sin(t * 2.2);
          window.__centerJet.mesh.scale.y = s;
          window.__centerJet.mesh.material.opacity =
            0.3 + 0.13 * Math.sin(t * 2.2);
        }
        if (window.__fountainVeils)
          window.__fountainVeils.forEach((v) => {
            v.mesh.material.opacity = 0.18 + 0.1 * Math.sin(t * 1.4 + v.phase);
          });
        if (window.__fountainFoam) {
          window.__fountainFoam.material.opacity =
            0.22 + 0.1 * Math.sin(t * 1.1);
        }

        gradePass.uniforms.uTime.value = t;
        composer.render();
        labelRenderer.render(scene, camera);
      }

      // intro cinematic reveal
      flyTo(sceneCenter, introOffset, 2400);
      finalizeContactShadows();
      animate();
      sendOrbitState(true);
      requestAnimationFrame(() =>
        requestAnimationFrame(() => {
          document.getElementById("fade").classList.add("hide");
          // bao cho trang React cha biet canh 3D da san sang (an loading overlay)
          try {
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: "vpv3d:ready" }, "*");
            }
          } catch (e) {}
        }),
      );
    </script>
  </body>
</html>
